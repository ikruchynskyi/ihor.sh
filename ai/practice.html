<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Math Practice · AI from scratch</title>
  <meta name="description" content="Generated mathematical practice problems with step-by-step solutions and mastery tracking for AI from scratch." />
  <style>
    :root {
      --bg: #fbfaf7;
      --fg: #1d1d1b;
      --muted: #6b6a66;
      --line: #dddad3;
      --card: #fff;
      --accent: #c2410c;
      --green: #15803d;
      --green-bg: #ecfdf5;
      --red: #b91c1c;
      --red-bg: #fef2f2;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
      font: 17px/1.65 ui-sans-serif, system-ui, sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 36px 16px 120px;
      overflow-x: clip;
    }
    .eyebrow {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 6px;
    }
    .eyebrow a {
      color: inherit;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 2rem;
      line-height: 1.25;
    }
    .lede {
      font-size: 1.05rem;
      color: var(--muted);
      margin-top: 4px;
      margin-bottom: 24px;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 24px;
      margin: 20px 0;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    .streak-dots {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--line);
      background: transparent;
      transition: all 0.2s ease;
    }
    .dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }
    .mastered-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 999px;
      background: #fef3c7;
      color: #92400e;
      border: 1px solid #fde68a;
      font-size: 0.85rem;
      font-weight: 700;
    }
    .prompt-box {
      font-size: 1.15rem;
      line-height: 1.6;
      margin: 20px 0 24px;
      padding: 16px 18px;
      background: color-mix(in srgb, var(--fg) 3%, transparent);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
    }
    form.answer-form {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin: 20px 0;
    }
    input[type="number"], input[type="text"] {
      font: inherit;
      font-size: 1.1rem;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--card);
      color: var(--fg);
      width: 180px;
      max-width: 100%;
      box-sizing: border-box;
    }
    input:focus {
      outline: 2px solid var(--accent);
      outline-offset: -1px;
    }
    .btn {
      font: inherit;
      font-weight: 600;
      font-size: 1rem;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
      text-decoration: none;
      display: inline-block;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
    .btn-secondary {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--fg);
    }
    .feedback {
      border-radius: 8px;
      padding: 14px 18px;
      margin: 18px 0;
      font-size: 0.98rem;
    }
    .feedback.correct {
      background: var(--green-bg);
      border: 1px solid #a7f3d0;
      color: var(--green);
    }
    .feedback.wrong {
      background: var(--red-bg);
      border: 1px solid #fecaca;
      color: var(--red);
    }
    .steps-box {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 8px;
      background: var(--card);
      border: 1px solid var(--line);
      color: var(--fg);
    }
    .steps-box ol {
      margin: 8px 0 0;
      padding-left: 22px;
    }
    .steps-box li {
      margin: 6px 0;
    }
    /* Grid for index of all skills */
    .skills-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      margin: 24px 0;
    }
    .skill-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .skill-card h3 {
      margin: 0 0 6px;
      font-size: 1.1rem;
    }
    .skill-card p {
      margin: 0 0 12px;
      font-size: 0.88rem;
      color: var(--muted);
    }
  </style>
  <script type="module" src="/learn-kit.js"></script>
</head>
<body>
<main id="app">
  <!-- Rendered by client script below -->
</main>

<script type="module">
import { skills, generate, checkAnswer } from "./practice.js";
import { state, save, gain, XP } from "./learn.js";
import { dayOf } from "./game.js";

const app = document.getElementById("app");
const params = new URLSearchParams(location.search);
const skillId = params.get("skill");

// Initialize state.practice if needed
state.practice ??= {};

if (!skillId || !skills[skillId]) {
  renderSkillList();
} else {
  renderPracticeView(skillId);
}

function renderSkillList() {
  const allIds = Object.keys(skills);
  const masteredCount = allIds.filter(id => state.practice[id]?.mastered).length;

  app.innerHTML = `
    <p class="eyebrow"><a href="./">AI from scratch</a> · Practice</p>
    <h1>Math Practice Drills</h1>
    <p class="lede">Sharpen the fundamental math operations from stages 0 and 1 with generated practice problems. Solve 5 consecutive problems correctly to master each skill.</p>

    <div class="card" style="margin-bottom: 24px; padding: 16px 20px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;">
        <div><b>Mastery Progress:</b> ${masteredCount} of ${allIds.length} skills mastered</div>
        <div style="font-size:0.9rem; color:var(--muted);">${state.xp.toLocaleString()} total XP</div>
      </div>
    </div>

    <div class="skills-grid">
      ${allIds.map(id => {
        const meta = skills[id];
        const pState = state.practice[id] || { streak: 0, mastered: false };
        return `
          <div class="skill-card">
            <div>
              <div style="display:flex; justify-content:space-between; align-items:center; gap:6px;">
                <h3>${meta.title}</h3>
                ${pState.mastered ? `<span class="mastered-badge">★ Mastered</span>` : ""}
              </div>
              <p>Taught in <a href="./${meta.lesson}">${meta.lesson.replace(".html", "")}</a><br>Current streak: ${pState.streak} / 5</p>
            </div>
            <div>
              <a href="?skill=${id}" class="btn btn-secondary" style="font-size:0.88rem; padding:6px 14px;">Practice →</a>
            </div>
          </div>
        `;
      }).join("")}
    </div>
  `;
}

function renderPracticeView(id) {
  const meta = skills[id];
  let curProb = generate(id);
  state.practice[id] ??= { streak: 0, mastered: false };

  function renderProblem() {
    const pState = state.practice[id];
    app.innerHTML = `
      <p class="eyebrow"><a href="./">AI from scratch</a> · <a href="./practice.html">All Skills</a> · Practice</p>
      <h1>${meta.title}</h1>
      <p class="lede">From <a href="./${meta.lesson}"><b>${meta.lesson.replace(".html", "")}</b></a>. Solve 5 in a row to achieve skill mastery.</p>

      <div class="card">
        <div class="status-bar">
          <div style="display:flex; align-items:center; gap:10px;">
            <span style="font-size:0.9rem; color:var(--muted);">Mastery streak:</span>
            <div class="streak-dots" title="${pState.streak} consecutive correct answers">
              ${[1, 2, 3, 4, 5].map(step => `
                <div class="dot ${step <= pState.streak ? "filled" : ""}"></div>
              `).join("")}
            </div>
            <span style="font-weight:700; font-size:0.95rem;">${pState.streak}/5</span>
          </div>
          ${pState.mastered ? `<span class="mastered-badge">★ Mastered</span>` : ""}
        </div>

        <div class="prompt-box" id="prompt-container">
          ${curProb.prompt}
        </div>

        <form class="answer-form" id="ans-form">
          <input type="number" step="any" id="ans-input" placeholder="Your answer" required autofocus autocomplete="off" />
          <button type="submit" class="btn" id="submit-btn">Submit Answer</button>
        </form>

        <div id="feedback-slot"></div>
      </div>

      <div style="margin-top:20px; display:flex; justify-content:space-between; align-items:center;">
        <a href="./practice.html" class="btn btn-secondary" style="font-size:0.9rem;">← Back to Skills</a>
        <a href="./${meta.lesson}" style="font-size:0.9rem; color:var(--muted);">Reread lesson</a>
      </div>
    `;

    function updateStatusBar() {
      const bar = document.querySelector(".status-bar");
      if (!bar) return;
      bar.innerHTML = `
        <div style="display:flex; align-items:center; gap:10px;">
          <span style="font-size:0.9rem; color:var(--muted);">Mastery streak:</span>
          <div class="streak-dots" title="${pState.streak} consecutive correct answers">
            ${[1, 2, 3, 4, 5].map(step => `
              <div class="dot ${step <= pState.streak ? "filled" : ""}"></div>
            `).join("")}
          </div>
          <span style="font-weight:700; font-size:0.95rem;">${pState.streak}/5</span>
        </div>
        ${pState.mastered ? `<span class="mastered-badge">★ Mastered</span>` : ""}
      `;
    }

    // Trigger KaTeX math rendering if learnKit is ready
    if (window.renderMathInElement) {
      window.renderMathInElement(app, {
        delimiters: [
          { left: "$$", right: "$$", display: true },
          { left: "\\[", right: "\\]", display: true },
          { left: "\\(", right: "\\)", display: false },
          { left: "$", right: "$", display: false }
        ],
        throwOnError: false
      });
    }

    window.__curProb = curProb;
    const form = document.getElementById("ans-form");
    const input = document.getElementById("ans-input");
    const slot = document.getElementById("feedback-slot");

    form.onsubmit = (e) => {
      e.preventDefault();
      const val = parseFloat(input.value.trim());
      if (Number.isNaN(val)) return;

      const isRight = checkAnswer(curProb.answer, val, curProb.tol);
      input.disabled = true;
      document.getElementById("submit-btn").style.display = "none";

      if (isRight) {
        pState.streak = Math.min(5, (pState.streak || 0) + 1);
        if (pState.streak >= 5) {
          pState.mastered = true;
        }
        save();
        updateStatusBar();

        // XP payout capped at 20 a day
        const day = dayOf();
        const todayPractice = state.log[day]?.acts?.practice ?? 0;
        let xpNotice = "";
        if (todayPractice < 20) {
          gain(XP.practice, "practice");
          xpNotice = ` (+${XP.practice} XP)`;
        }

        slot.innerHTML = `
          <div class="feedback correct">
            <b>✓ Correct!${xpNotice}</b>
            ${pState.streak >= 5 ? `<div style="margin-top:6px; font-weight:700;">★ Congratulations! You have mastered ${meta.title}!</div>` : ""}
          </div>
          <div style="text-align:right; margin-top:14px;">
            <button class="btn" id="next-btn">Next Problem →</button>
          </div>
        `;
      } else {
        pState.streak = 0;
        save();
        updateStatusBar();

        slot.innerHTML = `
          <div class="feedback wrong">
            <b>Not quite.</b> Correct answer: <b>${curProb.answer}</b>
          </div>
          <div class="steps-box">
            <b>Step-by-step solution:</b>
            <ol>
              ${curProb.steps.map(s => `<li>${s}</li>`).join("")}
            </ol>
          </div>
          <div style="text-align:right; margin-top:14px;">
            <button class="btn" id="next-btn">Try Another Problem →</button>
          </div>
        `;
      }

      document.getElementById("next-btn").onclick = () => {
        curProb = generate(id);
        renderProblem();
      };
    };
  }

  renderProblem();
}
</script>
</body>
</html>
