<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2D Studio</title>
<style>
	:root { --ink: #3b2a4d; --card: rgba(255, 255, 255, .88); --line: #e3c8f0; --accent: #ff7eb6; --accent2: #8f7bff; }
	html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; color: var(--ink);
		background: radial-gradient(120% 90% at 50% 10%, #fff6fb 0%, #ffe3f1 45%, #e6dcff 100%); }
	body.transparent { background: transparent; }
	canvas { display: block; position: absolute; inset: 0; }
	/* a soft floor and a few floating sparkles: a cute stage */
	#floor { position: absolute; left: 50%; bottom: 7vh; width: min(70vw, 560px); height: 7vh; transform: translateX(-50%);
		background: radial-gradient(closest-side, rgba(143, 123, 255, .25), transparent); pointer-events: none; }
	body.transparent #floor, body.transparent .spark { display: none; }
	.spark { position: absolute; color: #ffb6d9; font-size: 18px; animation: float 6s ease-in-out infinite; pointer-events: none; opacity: .7; }
	@keyframes float { 50% { transform: translateY(-14px) rotate(20deg); opacity: 1; } }
	#bubble { position: absolute; z-index: 3; max-width: min(420px, 80vw); transform: translate(-50%, -100%); padding: 9px 14px 10px; background: #fff;
		color: var(--ink); border: 3px solid var(--ink); border-radius: 18px; font: 700 18px/1.35 system-ui, sans-serif; box-shadow: 4px 4px 0 var(--ink);
		opacity: 0; transition: opacity .25s; pointer-events: none; }
	#bubble.show { opacity: 1; }
	#bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 10px solid transparent; border-bottom: 0; border-top-color: var(--ink); transform: translateX(-50%); }
	.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 6px 22px rgba(120, 60, 140, .14); }
	#title { position: absolute; z-index: 2; left: 16px; top: 14px; padding: 10px 14px; max-width: min(460px, calc(100% - 32px)); }
	#title h1 { margin: 0; font-size: 18px; }
	#title p { margin: 3px 0 0; color: #6b5580; font-size: 14px; }
	#bar { position: absolute; z-index: 2; left: 50%; bottom: 14px; transform: translateX(-50%); width: min(820px, calc(100% - 32px)); box-sizing: border-box;
		padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
	#bar select, #bar button, #bar input[type=text] { font: inherit; padding: 5px 9px; border-radius: 9px; border: 1px solid var(--line); background: #fff; color: var(--ink); }
	#bar button { cursor: pointer; }
	#bar button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
	#scrub { flex: 1 1 200px; accent-color: var(--accent2); }
	#time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
	#faces { display: flex; flex-wrap: wrap; gap: 4px; }
	#say { flex: 1 1 180px; }
	#status { position: absolute; z-index: 2; right: 16px; top: 16px; font-size: 13px; color: #7a6290; }
	body.headless #title, body.headless #bar, body.headless #status, body.ui0 #title, body.ui0 #bar, body.ui0 #status { display: none; }
</style>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js" } }
</script>
</head>
<body>
<div id="floor"></div>
<span class="spark" style="left:12%;top:28%">✦</span><span class="spark" style="left:84%;top:22%;animation-delay:-2s">✧</span>
<span class="spark" style="left:76%;top:62%;animation-delay:-4s">♡</span><span class="spark" style="left:18%;top:66%;animation-delay:-1s">✧</span>
<div id="bubble"></div>
<div id="title" class="card"><h1 id="name">Loading…</h1><p id="about"></p></div>
<div id="status"></div>
<div id="bar" class="card">
	<select id="character" aria-label="Character"></select>
	<select id="clip" aria-label="Dance or move"></select>
	<button id="play" type="button" aria-pressed="true" title="Play / pause (space)">⏸</button>
	<input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time in the clip">
	<span id="time">0.00 s</span>
	<button type="button" data-speed="0.5">½×</button><button type="button" data-speed="1" aria-pressed="true">1×</button>
	<div id="faces" role="group" aria-label="Face"></div>
	<input id="say" type="text" placeholder="Something for her to say…" maxlength="200" aria-label="Say">
</div>
<script type="module" src="src/studio.js"></script>
</body>
</html>
