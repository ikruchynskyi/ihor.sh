<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clip Preview · Mochi Studio</title>
<style>
	:root { --ink: #2a2136; --panel: rgba(255, 255, 255, .86); --line: #c9b8ff; --accent: #7a5cff; }
	html, body { margin: 0; height: 100%; overflow: hidden; font: 15px/1.4 system-ui, sans-serif; color: var(--ink); background: #e9e2ff; }
	canvas { display: block; }
	header { position: absolute; left: 16px; top: 14px; right: 16px; display: flex; gap: 12px; align-items: flex-start; pointer-events: none; }
	header > * { pointer-events: auto; }
	h1 { margin: 0; font-size: 18px; }
	#about { margin: 4px 0 0; max-width: 520px; color: #4b3f63; }
	.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; box-shadow: 0 4px 18px rgba(60, 40, 120, .12); }
	#bar { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); width: min(760px, calc(100% - 32px)); box-sizing: border-box;
		display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; }
	#bar select, #bar button { font: inherit; padding: 5px 9px; border-radius: 8px; border: 1px solid var(--line); background: #fff; color: var(--ink); cursor: pointer; }
	#bar button[aria-pressed="true"] { background: var(--accent); color: #fff; border-color: var(--accent); }
	#scrub { flex: 1 1 220px; accent-color: var(--accent); }
	#time { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; }
	.group { display: flex; gap: 4px; align-items: center; }
	@media (max-width: 600px) { #about { display: none; } }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
	"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.6.0/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<header><div class="card"><h1 id="name">Loading…</h1><p id="about">Loading her model…</p></div></header>
<div id="bar" class="card">
	<select id="clip" aria-label="Clip"></select>
	<button id="play" type="button" aria-pressed="true" title="Play / pause (space)">⏸ Pause</button>
	<input id="scrub" type="range" min="0" max="1" step="0.001" value="0" aria-label="Time in the clip">
	<span id="time">0.00 / 0.00 s</span>
	<div class="group" role="group" aria-label="Speed">
		<button type="button" data-speed="0.25">¼×</button><button type="button" data-speed="0.5">½×</button><button type="button" data-speed="1" aria-pressed="true">1×</button>
	</div>
	<div class="group" role="group" aria-label="Camera">
		<button type="button" data-cam="front">Front</button><button type="button" data-cam="side">Side</button><button type="button" data-cam="face">Face</button>
	</div>
</div>
<script type="module" src="src/preview.js"></script>
</body>
</html>
