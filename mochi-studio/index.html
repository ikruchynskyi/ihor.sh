<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mochi Studio</title>
<style>
	html, body { margin: 0; height: 100%; overflow: hidden; background: #1d1a24; color: #f4efff; font: 15px/1.4 system-ui, sans-serif; }
	canvas { display: block; }
	/* her line, anime-subtitle style, over her head */
	#bubble { position: absolute; z-index: 2; max-width: min(460px, 80vw); transform: translate(-50%, -100%); padding: 9px 14px 10px;
		background: #fffdf7; color: #2a2136; border: 3px solid #2a2136; border-radius: 18px; font: 700 18px/1.35 system-ui, sans-serif;
		box-shadow: 4px 4px 0 #2a2136; opacity: 0; transition: opacity .25s; pointer-events: none; }
	#bubble.show { opacity: 1; }
	#woof { position: absolute; z-index: 2; transform: translate(-50%, -100%); font: 900 16px system-ui, sans-serif; color: #7a3d00; background: #ffe0a8;
		border: 2px solid #7a3d00; border-radius: 12px; padding: 2px 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
	#woof.show { opacity: 1; }
	#bubble::after { content: ""; position: absolute; left: 50%; bottom: -12px; border: 10px solid transparent; border-bottom: 0; border-top-color: #2a2136; transform: translateX(-50%); }
	/* letterbox bars and the caption at the bottom: the anime-episode frame */
	.bar { position: absolute; left: 0; right: 0; height: 6vh; background: #000; z-index: 1; pointer-events: none; }
	.bar.top { top: 0; } .bar.bottom { bottom: 0; }
	body.nobars .bar { display: none; }
	#panel { position: absolute; z-index: 3; right: 10px; top: 7vh; width: 220px; max-height: 80vh; overflow: auto; background: rgba(20, 16, 30, .82);
		border: 1px solid #6b5a99; border-radius: 10px; padding: 8px; font-size: 13px; }
	#panel[hidden] { display: none; }
	#panel h3 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: #b9a8ff; }
	#panel button { margin: 2px; padding: 3px 7px; border-radius: 6px; border: 1px solid #6b5a99; background: #2c2440; color: #f4efff; font: inherit; cursor: pointer; }
	#panel button:hover { background: #3d3260; }
	#status { position: absolute; z-index: 3; left: 10px; bottom: calc(6vh + 8px); font-size: 12px; color: #cfc3ff; text-shadow: 0 1px 2px #000; }
	#toggle { position: absolute; z-index: 4; right: 10px; top: calc(6vh - 34px); }
	body.headless #panel, body.headless #status, body.headless #toggle { display: none; }
</style>
<script type="importmap">
{ "imports": {
	"three": "https://cdn.jsdelivr.net/npm/three@0.187.0/build/three.module.js",
	"three/addons/": "https://cdn.jsdelivr.net/npm/three@0.187.0/examples/jsm/",
	"@pixiv/three-vrm": "https://cdn.jsdelivr.net/npm/@pixiv/three-vrm@3.6.0/lib/three-vrm.module.min.js"
} }
</script>
</head>
<body>
<div class="bar top"></div><div class="bar bottom"></div>
<div id="bubble"></div><div id="woof">Woof!</div>
<div id="status"></div>
<button id="toggle" type="button" title="Controls (H)">☰</button>
<div id="panel" hidden></div>
<script type="module" src="src/world.js"></script>
</body>
</html>
