<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>vtuber</title>
<style>
	html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color-scheme: normal; }
	canvas { position: absolute; inset: 0; }
	#bubble {
		position: absolute; left: 10px; right: 10px; bottom: calc(66% + 6px); z-index: 2; /* in the band above her head */
		font: 600 19px/1.35 system-ui, sans-serif; color: #fff;
		background: rgba(24, 18, 38, .86); border: 1px solid #b99cff; border-radius: 12px;
		padding: 7px 10px; box-shadow: 0 2px 10px rgba(0, 0, 0, .4);
		opacity: 0; transform: translateY(-4px); transition: opacity .35s, transform .35s;
	}
	#bubble.show { opacity: 1; transform: none; }
	#bubble::after {
		content: ""; position: absolute; bottom: -8px; right: 46%; border: 8px solid transparent;
		border-bottom: 0; border-top-color: #b99cff;
	}
	/* Chat messages from the user: a floating speech balloon she "says" out loud. */
	#bubble.chat {
		background: linear-gradient(160deg, rgba(255, 246, 252, .96), rgba(236, 226, 255, .96));
		color: #2b1d3d; border: 2px solid #ff9ad5; border-radius: 16px;
		font: 700 20px/1.35 system-ui, sans-serif; padding: 10px 14px 11px;
	}
	#bubble.chat::before {
		content: "💬"; position: absolute; left: -8px; top: -13px; font-size: 22px;
		filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3));
	}
	#bubble.chat::after { border-top-color: #ff9ad5; }
	#bubble.chat.show { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1) both, float 2.6s ease-in-out .45s infinite; }
	@keyframes pop { from { opacity: 0; transform: translateY(14px) scale(.6) rotate(-4deg); } to { opacity: 1; transform: none; } }
	@keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-5px) rotate(.6deg); } }
	/* manga symbols around her head; --r = face radius in px, --s = size factor */
	#deco { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
	.deco {
		position: absolute; transform: translate(-50%, -50%); font-size: calc(var(--r) * 0.9 * var(--s));
		line-height: 1; white-space: nowrap; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .35));
		transition: opacity .35s;
	}
	.deco.bye { opacity: 0; }
	#acc { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
	.acc { position: absolute; line-height: 0; filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3)); }
	.acc svg { width: 100%; height: auto; display: block; }
	.deco.nya { color: #ff7eb3; font-weight: 900; font-family: "Hiragino Sans", "Yu Gothic", sans-serif; -webkit-text-stroke: 2px #fff; transform: translate(-50%, -50%) rotate(-10deg); }
	.deco.note { color: #ffd166; font-weight: 900; -webkit-text-stroke: 1px #6b4a00; }
	.deco.late { animation-delay: .35s !important; }
	.deco.red { color: #ff2b2b; font-weight: 900; -webkit-text-stroke: 2px #fff; }
	.deco.gold { color: #ffd84a; }
	.deco.blush { color: #ff5f8f; font-weight: 900; font-style: italic; letter-spacing: -.1em; }
	.deco.zz { color: #9fc4ff; font-weight: 900; font-family: Georgia, serif; -webkit-text-stroke: 1px #24345c; }
	.deco.doya {
		color: #fff; font-weight: 900; font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
		-webkit-text-stroke: 3px #1d1d1d; font-size: calc(var(--r) * 0.8 * var(--s)); transform: translate(-50%, -50%) rotate(-12deg);
	}
	.deco.river {
		width: calc(var(--r) * .22); height: calc(var(--r) * 1.4); transform: translate(-50%, 0);
		background: linear-gradient(#aee4ff, rgba(120, 200, 255, .2)); border-radius: 0 0 50% 50%;
	}
	.deco.gloomlines {
		width: calc(var(--r) * 3); height: calc(var(--r) * 1.6);
		background: repeating-linear-gradient(90deg, rgba(40, 30, 80, .75) 0 3px, transparent 3px 14px);
		-webkit-mask: linear-gradient(#000, transparent);
	}
	.deco.dots {
		width: calc(var(--r) * 1.3); height: calc(var(--r) * .55); border-radius: 50%; background: #fff;
		border: 2px solid #333;
	}
	.deco.dots::after {
		content: "..."; position: absolute; inset: 0; display: grid; place-items: center; color: #333;
		font: 900 calc(var(--r) * .5) system-ui; animation: dots 1.2s steps(4) infinite;
		clip-path: inset(0 100% 0 0);
	}
	@keyframes dots { to { clip-path: inset(0 -10% 0 0); } }
	.pulse { animation: pulse .5s ease-in-out infinite alternate; }
	@keyframes pulse { from { transform: translate(-50%, -50%) scale(.8); } to { transform: translate(-50%, -50%) scale(1.15); } }
	.drip { animation: drip 1.6s ease-in infinite; }
	@keyframes drip { 0% { transform: translate(-50%, -80%); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(-50%, 60%); opacity: 0; } }
	.pop { animation: pop2 .35s cubic-bezier(.2, 2, .4, 1) both; }
	@keyframes pop2 { from { transform: translate(-50%, -50%) scale(0); } to { transform: translate(-50%, -50%) scale(1); } }
	.bob { animation: bob 1.4s ease-in-out infinite; }
	@keyframes bob { 50% { transform: translate(-50%, -75%) rotate(10deg); } }
	.river { animation: river 1s linear infinite; }
	@keyframes river { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
	.fade { animation: fadein .5s both; }
	@keyframes fadein { from { opacity: 0; } }
	.twinkle { animation: twinkle .9s ease-in-out infinite; }
	@keyframes twinkle { 50% { transform: translate(-50%, -50%) scale(.4) rotate(45deg); opacity: .5; } }
	.rise { animation: rise 2.4s ease-out infinite; }
	@keyframes rise { from { transform: translate(-50%, -20%) scale(.7); opacity: 1; } to { transform: translate(-50%, -260%) scale(1.1); opacity: 0; } }
	.zz { animation: zz 2s ease-in-out infinite; }
	@keyframes zz { from { transform: translate(-50%, 0) scale(.6); opacity: 0; } 40% { opacity: 1; } to { transform: translate(10%, -160%) scale(1.1); opacity: 0; } }
	.slam { animation: slam .4s cubic-bezier(.2, 1.8, .4, 1) both; }
	@keyframes slam { from { transform: translate(-50%, -50%) rotate(-12deg) scale(2.5); opacity: 0; } to { transform: translate(-50%, -50%) rotate(-12deg) scale(1); opacity: 1; } }
	body[data-tint="gloom"] canvas { filter: brightness(.7) saturate(.6) hue-rotate(200deg); transition: filter .6s; }
	canvas { transition: filter .6s; }
	/* Her own lines: loud, bouncy, sticker-like. */
	#bubble.hype {
		background: linear-gradient(160deg, #fff36b, #ffb347); color: #2a1600; border: 3px solid #2a1600;
		border-radius: 18px 18px 18px 4px; font: 900 21px/1.25 system-ui, sans-serif; padding: 9px 14px 11px;
		box-shadow: 4px 4px 0 #2a1600; transform-origin: 50% 100%;
	}
	#bubble.hype::before { content: "⚡"; position: absolute; right: -8px; top: -14px; font-size: 24px; }
	#bubble.hype::after { border-top-color: #2a1600; }
	#bubble.hype.show { animation: boing .5s cubic-bezier(.2, 2.2, .4, 1) both, jitter .18s linear .5s 6; }
	@keyframes boing { from { opacity: 0; transform: scale(.3) rotate(8deg); } to { opacity: 1; transform: none; } }
	@keyframes jitter { 25% { transform: rotate(-1.5deg); } 75% { transform: rotate(1.5deg); } }
	#tag {
		position: absolute; right: 8px; bottom: 6px; z-index: 2; font: 600 14px system-ui, sans-serif;
		color: #efe6ff; background: rgba(0, 0, 0, .5); padding: 2px 8px; border-radius: 9px;
	}
</style>
<script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
</head>
<body>
<canvas id="stage"></canvas>
<div id="acc"></div>
<div id="deco"></div>
<div id="bubble"></div>
<div id="tag"></div>
<script src="overlay.js"></script>
</body>
</html>
