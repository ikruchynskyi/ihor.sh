<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>hud</title>
<style>
	html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; color-scheme: normal; }
	/* Alerts: a banner that drops in at the top centre for big moments. */
	#alerts { position: absolute; left: 50%; top: 70px; transform: translateX(-50%); display: grid; gap: 10px; justify-items: center; }
	.alert {
		--c: #ffcf5a; min-width: 360px; max-width: 640px; text-align: center; padding: 12px 28px 14px;
		background: linear-gradient(180deg, rgba(20, 14, 30, .94), rgba(36, 22, 48, .94));
		border: 3px solid var(--c); border-radius: 14px; color: #fff;
		box-shadow: 0 0 24px var(--c), 0 8px 24px rgba(0, 0, 0, .6);
		animation: drop .55s cubic-bezier(.2, 1.6, .4, 1) both, glow 1.2s ease-in-out .55s infinite alternate;
	}
	.alert .icon { font-size: 40px; line-height: 1; display: block; animation: wiggle .6s ease-in-out .5s 2; }
	.alert .title { font: 900 30px/1.15 system-ui, sans-serif; letter-spacing: .04em; text-transform: uppercase; color: var(--c);
		-webkit-text-stroke: 1px rgba(0, 0, 0, .5); text-shadow: 0 2px 0 rgba(0, 0, 0, .5); }
	.alert .sub { font: 600 19px/1.3 system-ui, sans-serif; color: #efe7ff; margin-top: 4px; }
	.alert.out { animation: up .45s ease-in both; }
	.alert.raid { --c: #ff6a3d; } .alert.level { --c: #7dff8a; } .alert.death { --c: #ff3355; }
	.alert.dog { --c: #ffb86b; } .alert.clip { --c: #b28cff; } .alert.loot { --c: #ffe066; } .alert.info { --c: #7fd3ff; }
	@keyframes drop { from { transform: translateY(-140%) scale(.8); opacity: 0; } to { transform: none; opacity: 1; } }
	@keyframes up { to { transform: translateY(-120%) scale(.9); opacity: 0; } }
	@keyframes glow { to { box-shadow: 0 0 44px var(--c), 0 8px 24px rgba(0, 0, 0, .6); } }
	@keyframes wiggle { 25% { transform: rotate(-14deg) scale(1.2); } 75% { transform: rotate(14deg) scale(1.2); } }
	/* Counters and the goal bar: bottom-left, a small persistent stream widget. */
	#widgets { position: absolute; left: 14px; bottom: 120px; display: grid; gap: 8px; width: 330px; }
	#counters { display: flex; flex-wrap: wrap; gap: 6px; }
	.counter { font: 800 16px/1 system-ui, sans-serif; color: #fff; background: rgba(18, 14, 26, .82); border: 1px solid rgba(255, 255, 255, .25);
		border-radius: 999px; padding: 6px 12px; }
	.counter b { color: #ffd166; margin-left: 6px; }
	.counter.bump { animation: bump .5s cubic-bezier(.2, 2, .4, 1); }
	@keyframes bump { 40% { transform: scale(1.35); background: rgba(255, 180, 60, .9); } }
	#goal { display: none; background: rgba(18, 14, 26, .86); border: 1px solid rgba(255, 255, 255, .25); border-radius: 10px; padding: 8px 10px 10px; }
	#goal .label { font: 800 15px/1.2 system-ui, sans-serif; color: #fff; display: flex; justify-content: space-between; gap: 8px; }
	#goal .label span:last-child { color: #ffd166; font-variant-numeric: tabular-nums; }
	#goal .bar { height: 14px; margin-top: 6px; border-radius: 7px; background: rgba(255, 255, 255, .12); overflow: hidden; }
	#goal .fill { height: 100%; width: 0; border-radius: 7px; background: linear-gradient(90deg, #ff5f6d, #ffc371); transition: width 1.2s cubic-bezier(.2, 1, .3, 1); }
</style>
</head>
<body>
<div id="alerts"></div>
<div id="widgets">
	<div id="counters"></div>
	<div id="goal"><div class="label"><span class="name"></span><span class="num"></span></div><div class="bar"><div class="fill"></div></div></div>
</div>
<script>
// Stream HUD: alerts {alert: {title, sub, style, icon}}, counters {counters: {name: value|null}},
// goal {goal: {label, value, max, invert}|null}. invert = the bar shows what's left (boss HP).
const ICONS = { raid: "⚔️", level: "⬆️", death: "💀", dog: "🐶", clip: "🎬", loot: "💎", info: "📣" };
const counters = {};
const fmt = (n) => typeof n === "number" ? n.toLocaleString("en-US") : String(n);

function alertBanner(a) {
	if (typeof a === "string") a = { title: a };
	const style = a.style || "info";
	const el = document.createElement("div");
	el.className = "alert " + style;
	const icon = document.createElement("span"); icon.className = "icon"; icon.textContent = a.icon || ICONS[style] || "📣";
	const title = document.createElement("div"); title.className = "title"; title.textContent = a.title || "";
	el.append(icon, title);
	if (a.sub) { const sub = document.createElement("div"); sub.className = "sub"; sub.textContent = a.sub; el.append(sub); }
	const box = document.getElementById("alerts");
	box.appendChild(el);
	while (box.children.length > 2) box.firstElementChild.remove();
	setTimeout(() => { el.classList.add("out"); setTimeout(() => el.remove(), 450); }, a.ms || 4500);
}

function setCounters(c, bump) {
	for (const [k, v] of Object.entries(c)) {
		if (v === null) delete counters[k]; else counters[k] = v;
	}
	const box = document.getElementById("counters");
	const old = Object.fromEntries([...box.children].map((e) => [e.dataset.k, e.dataset.v]));
	box.textContent = "";
	for (const [k, v] of Object.entries(counters)) {
		const el = document.createElement("div");
		el.className = "counter"; el.dataset.k = k; el.dataset.v = v;
		el.append(k); const b = document.createElement("b"); b.textContent = fmt(v); el.append(b);
		if (bump && old[k] !== undefined && old[k] !== String(v)) el.classList.add("bump");
		box.appendChild(el);
	}
}

function setGoal(g) {
	const box = document.getElementById("goal");
	if (!g) { box.style.display = "none"; return; }
	box.style.display = "block";
	box.querySelector(".name").textContent = g.label || "Goal";
	box.querySelector(".num").textContent = fmt(g.value) + (g.max ? " / " + fmt(g.max) : "");
	const pct = g.max ? Math.max(0, Math.min(100, 100 * g.value / g.max)) : 0;
	box.querySelector(".fill").style.width = pct + "%";
}

new EventSource("/__vtuber/events").onmessage = (e) => {
	let cmd; try { cmd = JSON.parse(e.data); } catch (_) { return; }
	if (cmd.build) { if (window.build && window.build !== cmd.build) location.reload(); window.build = cmd.build; }
	if (cmd.alert) alertBanner(cmd.alert);
	if (cmd.counters) setCounters(cmd.counters, !cmd.initial);
	if ("goal" in cmd) setGoal(cmd.goal);
};
</script>
</body>
</html>
