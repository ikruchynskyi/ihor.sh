<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Yomu Kanji Dictionary</title>
  <meta name="description" content="Any kanji or Japanese word: kun and on readings, meaning, JLPT level, animated stroke order, radical and parts, the words that use it from N5 to N1, and example sentences with furigana and English. Data from Jisho.org, cached; stroke order from KanjiVG." />
  <link rel="stylesheet" href="/yomu/yomu.css" />
  <style>
    .khead { display: grid; grid-template-columns: 180px 1fr; gap: 18px; align-items: start; }
    .khead .glyph { font-size: 120px; line-height: 1; text-align: center; }
    .khead .stroke { width: 180px; height: 180px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; } .badges span { border: 1px solid var(--line); padding: 1px 8px; font-size: .85rem; }
    .rd { font-size: 1.25rem; } .rd .muted { font-size: .85rem; }
    .words2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 6px 14px; }
    .words2 div { padding: 4px 0; border-bottom: 1px solid var(--line); }
    .sent { padding: 8px 0; border-bottom: 1px solid var(--line); } .sent .jp { font-size: 1.15rem; }
    a.klink { color: inherit; text-decoration: underline dotted; text-underline-offset: 3px; }
    .hits div { padding: 6px 0; border-bottom: 1px solid var(--line); }
    @media (max-width: 600px) { .khead { grid-template-columns: 1fr; } .khead .glyph, .khead .stroke { margin: 0 auto; } }
  </style>
</head>
<body>
<main>
  <p class="eyebrow"><a href="/yomu/">Yomu · Japanese</a> · Kanji dictionary · <a href="/yomu/practice.html">Practice words</a></p>
  <div id="settings"></div>
  <form id="find" class="card2"><input id="q" type="search" placeholder="A kanji, a word (日本語, たべる) or English" aria-label="Search kanji and words" style="width:100%;max-width:460px"> <button>Search</button></form>
  <div id="hits" class="hits"></div>
  <div id="page"></div>
  <p class="muted" style="margin-top:40px">Kanji pages and word search: <a href="https://jisho.org" target="_blank" rel="noopener">Jisho.org</a> (from KANJIDIC and JMdict by EDRDG, CC BY-SA; sentences from Tatoeba, CC BY 2.0 FR, and Jreibun), read once and cached on this site. Stroke order: <a href="https://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a> by Ulrich Apel, CC BY-SA 3.0.</p>
</main>
<script type="module">
import { state, settingsBar, esc, speak, strokes, romaji, toHiragana, hasKanji, addCard, kanjiCard, inDeck, vocab, data, DECK_LEVELS, wordHtml, kanjiLinks, kanjiHref, wordCard, gain } from "/yomu/lib.js";
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const k = [...(params.get("k") ?? "")][0] ?? "";
const allWords = (await Promise.all(DECK_LEVELS.map(async (lv) => (await vocab(lv)).map((w) => ({ ...w, lv }))))).flat();
const localKanji = new Map((await data("kanji")).map((x) => [x.k, x]));
const reading = (r) => (state.settings.script === "romaji" ? romaji(toHiragana(r.replace(/[.\-]/g, ""))) : r);
let info = null;

function sentenceHtml(s) {
  const ja = s.ja.map(([t, r]) => (r && state.settings.script === "kanji" && state.settings.furigana !== "none" ? `<ruby>${kanjiLinks(t)}<rt>${esc(r)}</rt></ruby>` : state.settings.script === "kanji" ? kanjiLinks(t) : esc(t))).join("");
  const say = s.ja.map(([t, r]) => r ?? t).join("");
  return `<div class="sent"><span class="jp">${ja}</span> <button class="mini" data-say="${esc(say)}" aria-label="Play">▶</button>${state.settings.translation ? `<br><span class="muted">${esc(s.en)}${s.src ? ` · ${esc(s.src === "tatoeba" ? "Tatoeba" : s.src === "jreibun" ? "Jreibun" : s.src)}` : ""}</span>` : ""}</div>`;
}
const wordRow = (w, r, m, extra = "") => `<div><span class="jp">${wordHtml(w, r)}</span> <button class="mini" data-say="${esc(r)}" aria-label="Play">▶</button> <span class="muted">${esc(m)}${extra}</span></div>`;

function render() {
  if (!k) { $("page").innerHTML = `<p class="muted">Search above, or open a kanji from any word in <a href="/yomu/practice.html">Practice</a> or the <a href="/yomu/deck.html?type=words">word decks</a>.</p>`; return; }
  const loc = localKanji.get(k), i = info, found = i?.found;
  const meanings = found ? i.meanings : loc?.m ?? [], kun = found ? i.kun : loc?.kun ?? [], on = found ? i.on : loc?.on ?? [];
  const jlpt = (found && i.jlpt) || (loc ? `N${loc.n}` : ""), strokesN = (found && i.strokes) || loc?.s;
  const uses = allWords.filter((w) => w.w.includes(k));
  document.title = `${k} · Yomu Kanji Dictionary`;
  $("page").innerHTML = `<section class="card2"><div class="khead"><div><div class="glyph jp">${esc(k)}</div><div class="stroke" id="ks"></div><p style="text-align:center"><button class="mini" id="replay">✍ Strokes again</button></p></div><div>
    <h1 style="margin:0">${esc(meanings.join(", ") || (i && !found ? "Not in Jisho's kanji dictionary" : "…"))}</h1>
    <div class="badges">${jlpt ? `<span>JLPT ${esc(jlpt)}</span>` : `<span>not on the JLPT lists</span>`}${strokesN ? `<span>${strokesN} strokes</span>` : ""}${found && i.grade ? `<span>${esc(i.grade)}</span>` : ""}${found && i.freq ? `<span>#${i.freq} of 2,500 in newspapers</span>` : ""}</div>
    <p class="rd">Kun (Japanese) <span class="jp">${kun.map((r) => esc(reading(r))).join("、") || "—"}</span><br>On (Chinese) <span class="jp">${on.map((r) => esc(reading(r))).join("、") || "—"}</span><br>
    <span class="muted">Kun readings are for the kanji on its own or with kana after it (the dot marks where the kana starts); on readings for compounds of two or more kanji.</span></p>
    ${found && (i.radical || i.parts?.length) ? `<p>Radical: <span class="jp">${esc(i.radical?.char ?? "")}</span> <span class="muted">${esc(i.radical?.meaning ?? "")}</span>${i.parts?.length ? ` · Parts: ${i.parts.map((p) => (p === k ? `<span class="jp">${esc(p)}</span>` : `<a class="klink jp" href="${kanjiHref(p)}">${esc(p)}</a>`)).join(" ")}` : ""}<br><span class="muted">Parts make a story to remember it by: ask Blip for one.</span></p>` : ""}
    <p><button class="mini" id="kadd">${inDeck("k:" + k) ? "✓ In your review deck" : "+ Add to review"}</button> ${!info ? '<span class="muted">Loading from Jisho…</span>' : ""}</p></div></div></section>
    ${uses.length ? `<h2>Words with ${esc(k)} on the JLPT lists <span class="muted">(${uses.length})</span></h2><div class="words2">${uses.slice(0, 24).map((w) => wordRow(w.w, w.r, w.m, ` · ${w.lv}`)).join("")}</div>` : ""}
    ${found && (i.onWords.length || i.kunWords.length) ? `<h2>Compounds by reading</h2><div class="words2">${[...i.kunWords, ...i.onWords].map(([w, r, m]) => wordRow(w, toHiragana(r), m)).join("")}</div>` : ""}
    ${found && i.sentences.length ? `<h2>Example sentences</h2>${i.sentences.map(sentenceHtml).join("")}` : found ? "" : ""}
    ${i?.error ? `<p class="muted">Couldn't reach Jisho right now (${esc(i.error)}); showing what Yomu has locally.</p>` : ""}`;
  strokes(k, $("ks"));
  $("replay").onclick = () => strokes(k, $("ks"));
  $("kadd").onclick = () => { addCard(...kanjiCard({ k, on, kun, m: meanings })); gain(1); $("kadd").textContent = "✓ In your review deck"; };
}
document.addEventListener("click", (e) => { const b = e.target.closest("[data-say]"); if (b) speak(b.dataset.say); });
settingsBar($("settings"), () => { render(); if ($("q").value) search($("q").value); });
render();
if (k) {
  info = await fetch(`/api/yomu/kanji?k=${encodeURIComponent(k)}`).then((r) => r.json()).catch((e) => ({ error: e.message }));
  render();
}

// ---------- search: the JLPT word lists first (instant), then Jisho for anything else ----------
async function search(q) {
  q = q.trim();
  if (!q) { $("hits").innerHTML = ""; return; }
  if ([...q].length === 1 && hasKanji(q)) { location.href = kanjiHref(q); return; }
  const low = q.toLowerCase(), kana = toHiragana(q);
  const local = allWords.filter((w) => w.w.includes(q) || toHiragana(w.r).includes(kana) || romaji(toHiragana(w.r)) === low || w.m.toLowerCase().split(/[;,]/).some((s) => s.trim().replace(/^to /, "") === low.replace(/^to /, ""))).slice(0, 20);
  const kanjiIn = [...new Set([...q].filter(hasKanji))];
  const head = kanjiIn.length > 1 ? `<p>Kanji in “${esc(q)}”: ${kanjiIn.map((c) => `<a class="klink jp" style="font-size:1.6rem;margin-right:8px" href="${kanjiHref(c)}">${esc(c)}</a><span class="muted">${esc(localKanji.get(c)?.m.slice(0, 2).join(", ") ?? "")}</span>`).join(" · ")}</p>` : "";
  const row = (w, extra) => `<div><span class="jp" style="font-size:1.2rem">${wordHtml(w.w, w.r)}</span> <button class="mini" data-say="${esc(w.r)}" aria-label="Play">▶</button> <span class="muted">${esc(w.m)}${extra}</span> ${w.lv || w.jlpt ? `<button class="mini" data-add="${esc(w.w)}|${esc(w.r)}|${esc(w.m)}">${inDeck("w:" + w.w) ? "✓ practicing" : "+ practice"}</button>` : ""}</div>`;
  $("hits").innerHTML = `${head}${local.length ? `<p class="muted">On the JLPT lists</p>${local.map((w) => row(w, ` · ${w.lv}`)).join("")}` : ""}<p class="muted" id="jishoMsg">Searching Jisho…</p><div id="jishoHits"></div>`;
  const d = await fetch(`/api/yomu/search?q=${encodeURIComponent(q)}`).then((r) => r.json()).catch(() => null);
  const more = (d?.results ?? []).filter((x) => !local.some((w) => w.w === x.w && w.r === x.r));
  $("jishoMsg").textContent = d?.error || !d ? "Jisho didn't answer." : more.length ? "More from Jisho" : local.length ? "" : "Nothing found.";
  $("jishoHits").innerHTML = more.map((w) => row(w, `${w.jlpt ? ` · ${w.jlpt}` : ""}${w.common ? " · common" : ""}`)).join("");
}
$("find").addEventListener("submit", (e) => { e.preventDefault(); history.replaceState(null, "", `?${k ? `k=${encodeURIComponent(k)}&` : ""}q=${encodeURIComponent($("q").value)}`); search($("q").value); });
$("hits").addEventListener("click", (e) => { const b = e.target.closest("[data-add]"); if (!b) return; const [w, r, m] = b.dataset.add.split("|"); addCard(...wordCard({ w, r, m })); gain(1); b.textContent = "✓ practicing"; });
if (params.get("q")) { $("q").value = params.get("q"); search(params.get("q")); }

window.blipContext = () => ({ page: k ? `Yomu kanji dictionary: ${k}` : "Yomu kanji dictionary search", role: "You are a Japanese tutor. For a kanji, give a memorable story from its parts, explain when the kun vs on reading is used with examples from the page, and quiz the learner.", kanji: k || undefined,
  meanings: info?.meanings, kun: info?.kun, on: info?.on, radical: info?.radical, parts: info?.parts, jlpt: info?.jlpt, search: $("q").value || undefined });
window.blipActions = { say_japanese: { label: "spoke Japanese", description: "Say a Japanese word or sentence aloud.", parameters: { text: { type: "string", description: "Japanese text" } }, run: ({ text }) => speak(String(text ?? "")) } };
</script>
</body>
</html>
