<title>ihor.sh Ideas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Layout: sticky band index on the left, idea "channels" on the right; one column on phones. */
  :root {
    --bg: #f2f4f6; --surface: #ffffff; --fg: #17202b; --muted: #5b6673; --line: #d9dee4;
    --accent: #0b6e7f; --accent-soft: #e0f0f2;
    --built: #2b8a3e; --designed: #b7791f; --idea: #7a8591; --rejected: #c92a2a;
    --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
    --body: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0f1419; --surface: #161d24; --fg: #e4e9ee; --muted: #93a0ad; --line: #26313b;
    --accent: #4fc3d4; --accent-soft: #15303a;
    --built: #69db7c; --designed: #f0b44c; --idea: #9aa5b1; --rejected: #ff8787; color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0f1419; --surface: #161d24; --fg: #e4e9ee; --muted: #93a0ad; --line: #26313b;
    --accent: #4fc3d4; --accent-soft: #15303a;
    --built: #69db7c; --designed: #f0b44c; --idea: #9aa5b1; --rejected: #ff8787; color-scheme: dark; }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 15.5px/1.6 var(--body); margin: 0; }
  .wrap { max-width: 1180px; margin: 0 auto; padding-inline: 20px; padding-block: 28px 80px; }
  a { color: var(--accent); }
  code { font: 0.86em var(--mono); background: var(--accent-soft); padding: 1px 5px; border-radius: 4px; overflow-wrap: anywhere; }

  header { display: grid; gap: 14px; margin-bottom: 22px; }
  .eyebrow { font: 500 12px var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  h1 { font: 800 clamp(2rem, 5vw, 3.2rem)/1 var(--display); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  h1 span { color: var(--accent); }
  .lede { color: var(--muted); max-width: 62ch; margin: 0; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .chip { font: 500 13px var(--mono); border: 1px solid var(--line); background: var(--surface); color: var(--fg);
          border-radius: 999px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 7px; align-items: center; }
  .chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
  .chip[aria-pressed="false"] { opacity: 0.45; }
  .chip .n { color: var(--muted); font-variant-numeric: tabular-nums; }
  .chip:focus-visible, input:focus-visible, .toc a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #q { font: 14px var(--body); padding: 6px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface);
       color: var(--fg); min-width: 0; flex: 1 1 200px; max-width: 320px; }

  .layout { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: 32px; align-items: start; }
  .toc { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); display: grid; gap: 2px; font-size: 14px; }
  .toc a { color: var(--muted); text-decoration: none; padding: 4px 10px; border-radius: 6px; display: flex; justify-content: space-between; gap: 8px; }
  .toc a:hover, .toc a.on { color: var(--fg); background: var(--surface); }
  .toc .n { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }

  main { min-width: 0; display: grid; gap: 40px; }
  section > h2 { font: 800 1.55rem/1.2 var(--display); letter-spacing: -0.015em; margin: 0 0 12px; scroll-margin-top: 16px; text-wrap: balance; }
  section > p, section > ul, section > ol { max-width: 75ch; }
  .idea { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; margin: 12px 0;
          border-left: 4px solid var(--c, var(--line)); }
  .idea > h3 { font: 600 1.12rem/1.3 var(--display); margin: 0 0 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; text-wrap: balance; }
  .idea h4 { font: 600 1rem/1.3 var(--display); margin: 18px 0 6px; }
  .status { font: 500 11px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); border: 1px solid var(--c);
            border-radius: 999px; padding: 1px 8px; white-space: nowrap; }
  .idea p, .idea li { max-width: 78ch; }
  .idea ul, .idea ol { padding-left: 1.2em; }
  li { margin: 3px 0; }
  .table { overflow-x: auto; margin: 10px 0; }
  table { border-collapse: collapse; font-size: 14px; min-width: 520px; width: 100%; }
  th, td { text-align: left; vertical-align: top; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { font: 500 12px var(--mono); letter-spacing: 0.05em; text-transform: uppercase; color: var(--muted); }
  hr { display: none; }
  .empty { color: var(--muted); font-style: italic; }
  [data-st="built"] { --c: var(--built); } [data-st="designed"] { --c: var(--designed); }
  [data-st="idea"] { --c: var(--idea); } [data-st="rejected"] { --c: var(--rejected); }

  @media (max-width: 820px) {
    .layout { grid-template-columns: minmax(0, 1fr); }
    .toc { position: static; display: flex; overflow-x: auto; gap: 4px; padding-bottom: 4px; }
    .toc a { white-space: nowrap; background: var(--surface); }
  }
  @media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

<div class="wrap">
  <header>
    <div class="eyebrow">Backlog · updated <span id="updated"></span></div>
    <h1>ihor<span>.sh</span> ideas</h1>
    <p class="lede">Every project idea for ihor.sh: radio, bikepacking, EDC, Japanese and NYC. Each has a status and the improvements found so far. The rule: no thin wrappers.</p>
    <div class="controls" id="controls">
      <input id="q" type="search" placeholder="Search ideas, e.g. WebUSB, Ollama, SSTV" aria-label="Search ideas">
    </div>
  </header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sections"></nav>
    <main id="doc"></main>
  </div>
</div>

<script type="text/markdown" id="src"><!--IDEAS--></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/15.0.7/marked.min.js"></script>
<script>
const STATUS = [["built", "🟢", "Built"], ["designed", "🟡", "Designed"], ["idea", "⚪", "Idea"], ["rejected", "✗", "Rejected"]];
const md = document.getElementById("src").textContent;
const doc = document.getElementById("doc");
const tmp = document.createElement("div");
tmp.innerHTML = marked.parse(md);

// The file's own H1 and intro become the header; drop them from the body.
const h1 = tmp.querySelector("h1"); if (h1) h1.remove();
const log = md.match(/^- \*\*(\d{4}-\d{2}-\d{2})/m);
document.getElementById("updated").textContent = log ? log[1] : "";

// Group: H2 → <section>, H3 inside it → <article class="idea">.
let section = null, idea = null;
const slug = (t) => t.toLowerCase().replace(/[^\p{L}\p{N}]+/gu, "-").replace(/^-|-$/g, "");
for (const node of [...tmp.childNodes]) {
  if (node.nodeType === 1 && node.tagName === "H2") {
    section = document.createElement("section");
    section.id = slug(node.textContent);
    section.append(node); doc.append(section); idea = null; continue;
  }
  if (!section) continue; // intro lines before the first H2 are covered by the header
  if (node.nodeType === 1 && node.tagName === "H3") {
    idea = document.createElement("article");
    idea.className = "idea";
    const st = STATUS.find(([, e]) => node.textContent.trim().startsWith(e));
    if (st) {
      idea.dataset.st = st[0];
      node.innerHTML = node.innerHTML.replace(st[1], "").trim();
      const pill = document.createElement("span");
      pill.className = "status"; pill.textContent = st[2];
      node.prepend(pill);
    }
    idea.append(node); section.append(idea); continue;
  }
  (idea || section).append(node);
}
doc.querySelectorAll("table").forEach((t) => { const w = document.createElement("div"); w.className = "table"; t.replaceWith(w); w.append(t); });
doc.querySelectorAll("a[href^='http']").forEach((a) => { a.target = "_blank"; a.rel = "noopener"; });

// Status chips with counts.
const controls = document.getElementById("controls");
const on = new Set(STATUS.map(([k]) => k));
for (const [k, , label] of STATUS) {
  const n = doc.querySelectorAll(`.idea[data-st="${k}"]`).length;
  if (!n) continue;
  const b = document.createElement("button");
  b.className = "chip"; b.dataset.st = k; b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot"></span>${label} <span class="n">${n}</span>`;
  b.addEventListener("click", () => { on.has(k) ? on.delete(k) : on.add(k); b.setAttribute("aria-pressed", on.has(k)); apply(); });
  controls.insertBefore(b, document.getElementById("q"));
}

// Section index.
const toc = document.getElementById("toc");
function buildToc() {
  toc.innerHTML = "";
  for (const s of doc.querySelectorAll("section")) {
    if (s.hidden) continue;
    const ideas = [...s.querySelectorAll(".idea")].filter((i) => !i.hidden).length;
    const a = document.createElement("a");
    a.href = "#" + s.id;
    a.innerHTML = `<span>${s.querySelector("h2").textContent}</span>${ideas ? `<span class="n">${ideas}</span>` : ""}`;
    toc.append(a);
  }
}

const q = document.getElementById("q");
function apply() {
  const term = q.value.trim().toLowerCase();
  for (const s of doc.querySelectorAll("section")) {
    const ideas = [...s.querySelectorAll(".idea")];
    let shown = 0;
    for (const i of ideas) {
      const ok = (!i.dataset.st || on.has(i.dataset.st)) && (!term || i.textContent.toLowerCase().includes(term));
      i.hidden = !ok; shown += ok;
    }
    // Sections without idea cards (Principles, Hosting, Log) follow the search only.
    s.hidden = ideas.length ? !shown : (!!term && !s.textContent.toLowerCase().includes(term));
  }
  let empty = doc.querySelector(".empty");
  const none = [...doc.querySelectorAll("section")].every((s) => s.hidden);
  if (none && !empty) { empty = document.createElement("p"); empty.className = "empty"; empty.textContent = "No ideas match. Clear the search or turn a status back on."; doc.append(empty); }
  if (!none && empty) empty.remove();
  buildToc();
}
q.addEventListener("input", apply);
apply();

// Highlight the section in view.
const io = new IntersectionObserver((es) => es.forEach((e) => {
  if (e.isIntersecting) toc.querySelectorAll("a").forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + e.target.id));
}), { rootMargin: "-20% 0px -70% 0px" });
doc.querySelectorAll("section").forEach((s) => io.observe(s));
</script>
