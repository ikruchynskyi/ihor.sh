<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Site admin</title>
  <meta name="description" content="The site's controls, for its owner: accounts and their rights, and what visitors and members do on the site." />
  <meta name="robots" content="noindex, nofollow" />
  <style>
    :root { --bg: #fbfaf7; --fg: #1d1d1b; --muted: #6b6a66; --line: #dddad3; --card: #fff; --accent: #c2410c; --ok: #1e6b35; --warn: #b4232c; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121211; --fg: #e9e7e1; --muted: #9a978f; --line: #2c2b28; --card: #1a1a18; --ok: #69db7c; --warn: #ff8787; } }
    body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.5 ui-sans-serif, system-ui, sans-serif; }
    main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 120px; }
    [hidden] { display: none !important; }
    .hint { color: var(--muted); font-size: 13px; }
    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin: 14px 0; overflow-x: auto; }
    .tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font: inherit; color: var(--muted); cursor: pointer; white-space: nowrap; }
    .tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); font-weight: 700; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 12px 0; }
    .kpi { padding: 10px 12px; } .kpi b { display: block; font-size: 24px; line-height: 1.15; } .kpi span { color: var(--muted); font-size: 12.5px; }
    .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 18px; } .grid2 > * { min-width: 0; }
    .scrollx { overflow-x: auto; }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; } th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 12px; } td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
    tr[data-who] { cursor: pointer; } tr[data-who]:hover td { background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .chart svg { display: block; width: 100%; height: auto; } .chart .bar { fill: var(--accent); } .chart .ax { fill: var(--muted); font-size: 11px; } .chart g:hover .bar { opacity: .7; }
    .chip { display: inline-block; font-size: 11.5px; padding: 0 7px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
    .bad { color: var(--warn); } h2 { margin: 18px 0 6px; font-size: 17px; }
  </style>
</head>
<body>
<main>
  <p class="eyebrow"><a href="/">ihor.sh</a> · Admin</p>
  <h1 style="margin:4px 0">Site admin</h1>
  <p class="hint">Only the admin sees this page. More controls will live here; for now: accounts and their rights, and what everyone does on the site.</p>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="users" aria-selected="true">👤 Users &amp; rights</button>
    <button type="button" role="tab" data-tab="activity" aria-selected="false">📈 Activity</button>
    <button type="button" role="tab" data-tab="jobs" aria-selected="false">⚙ Jobs &amp; queues</button>
  </nav>
  <section id="t-users"><p class="hint">Loading…</p></section>
  <section id="t-activity" hidden>
    <p><label>Last <select id="days"><option value="1">day</option><option value="7" selected>7 days</option><option value="30">30 days</option><option value="90">90 days</option></select></label> <span class="hint" id="actStep"></span></p>
    <div id="act"></div>
  </section>
  <section id="t-jobs" hidden>
    <p><button type="button" id="jobsRefresh">Refresh</button> <span class="hint" id="jobsStep"></span></p>
    <div id="jobsOut"></div>
    <div id="sourcesOut"></div>
    <div id="coverageOut"></div>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const get = (u, init) => fetch(u, init).then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.error ?? `HTTP ${r.status}`); return d; });
const when = (t) => (t ? new Date(t * 1000).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "—");
let users = [];
const nameOf = (who, uid) => { const u = users.find((x) => x.id === (uid ?? who)); return u ? `${esc(u.name)}${u.email ? ` <span class="hint">${esc(u.email)}</span>` : ""}` : who.startsWith("g:") ? `Guest <span class="hint">${esc(who.slice(2, 8))}</span>` : `Guest, no cookie <span class="hint">${esc(who.slice(3, 9))}</span>`; };

async function loadUsers() {
  users = await get("/api/admin/users");
  const s = await get("/api/admin/stats?days=30").catch(() => null), by = new Map((s?.people ?? []).map((p) => [p.user_id ?? p.who, p]));
  $("t-users").innerHTML = `<p class="hint">${users.length} account${users.length === 1 ? "" : "s"}. <b>Cloud model</b>: the user's AI (Blip, the job and résumé tools, company cards) runs on the cloud model with no throttling or line, as the admin's does; everyone else gets the local model and the limits.</p>
    <div class="scrollx"><table><thead><tr><th>User</th><th>Signed in with</th><th>Joined</th><th>Last sign-in</th><th class="n">Pages, 30 d</th><th class="n">Actions, 30 d</th><th>Cloud model, no limits</th></tr></thead><tbody>
    ${users.map((u) => { const a = by.get(u.id); return `<tr data-who="${esc(u.id)}"><td>${u.picture ? `<img src="${esc(u.picture)}" alt="" width="20" height="20" style="border-radius:50%;vertical-align:-5px;margin-right:6px" referrerpolicy="no-referrer">` : ""}<b>${esc(u.name)}</b>${u.role === "admin" ? ' <span class="chip">admin</span>' : ""}<br><span class="hint">${esc(u.email ?? u.id)}</span></td>
      <td>${esc(u.provider)}</td><td>${when(u.created)}</td><td>${when(u.seen)}</td><td class="n">${a?.pages ?? 0}</td><td class="n">${a?.actions ?? 0}</td>
      <td>${u.role === "admin" ? '<span class="hint">always</span>' : `<label><input type="checkbox" data-cloud="${esc(u.id)}" ${u.cloud ? "checked" : ""}> allowed</label>`}</td></tr>`; }).join("")}</tbody></table></div>
    <div id="userLog"></div>`;
}
$("t-users").addEventListener("change", async (e) => {
  const id = e.target.dataset?.cloud; if (!id) return;
  e.target.disabled = true;
  try { await get(`/api/admin/users?id=${encodeURIComponent(id)}&cloud=${e.target.checked ? 1 : 0}`, { method: "POST" }); } catch (err) { e.target.checked = !e.target.checked; alert(err.message); } finally { e.target.disabled = false; }
});

/** One person's latest page views and actions. */
async function showLog(who, box) {
  const ev = await get(`/api/admin/events?who=${encodeURIComponent(who)}`);
  $(box).innerHTML = `<h2>${nameOf(who)}: latest</h2>${eventsTable(ev)}`; $(box).scrollIntoView({ behavior: "smooth", block: "start" });
}
const eventsTable = (ev) => ev.length ? `<div class="scrollx"><table><thead><tr><th>When</th><th>Who</th><th>What</th><th>Detail</th><th class="n">ms</th></tr></thead><tbody>${ev.map((e) => `<tr><td>${when(e.at)}</td><td>${nameOf(e.who, e.user_id)}${e.bot ? ' <span class="chip">bot</span>' : ""}</td>
  <td>${e.kind === "page" ? `<span class="hint">page</span> ${esc(e.name)}` : esc(e.name)}${e.status >= 400 ? ` <span class="bad">${e.status}</span>` : ""}</td><td>${esc(e.detail)}</td><td class="n">${e.ms}</td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">Nothing yet.</p>`;
for (const [box, log] of [["t-users", "userLog"], ["act", "actLog"]]) $(box).addEventListener("click", (e) => { const tr = e.target.closest("tr[data-who]"); if (tr && !e.target.closest("input,label")) showLog(tr.dataset.who, log); });

/** People per day: a bar a day (hover for the numbers). */
function daily(d) {
  if (!d.length) return "";
  const W = 600, H = 120, B = 18, max = Math.max(1, ...d.map((x) => x.people)), bw = W / d.length;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="People a day: ${d.map((x) => `${x.day} ${x.people}`).join(", ")}">${d.map((x, i) => { const h = Math.max(2, (x.people / max) * (H - B - 8));
    return `<g><title>${x.day}: ${x.people} people, ${x.pages} page views, ${x.actions} actions</title><rect x="${i * bw}" y="0" width="${bw}" height="${H - B}" fill="transparent"/><rect class="bar" x="${i * bw + 1}" y="${H - B - h}" width="${Math.max(1, bw - 2)}" height="${h}" rx="2"/></g>`; }).join("")}
    <text class="ax" x="0" y="${H - 4}">${d[0].day}</text><text class="ax" x="${W}" y="${H - 4}" text-anchor="end">${d.at(-1).day}</text><text class="ax" x="0" y="10">${max} people</text></svg></div>`;
}
async function loadActivity() {
  $("actStep").textContent = "Loading…";
  const s = await get(`/api/admin/stats?days=${$("days").value}`), t = s.totals ?? {}, tile = (v, l, sub = "") => `<div class="kpi card"><b>${(v ?? 0).toLocaleString()}</b><span>${l}${sub ? `<br>${sub}` : ""}</span></div>`;
  const recent = await get("/api/admin/events");
  $("act").innerHTML = `<div class="kpis">${tile(t.people, "people", `${t.members ?? 0} signed in`)}${tile(t.pages, "page views")}${tile(t.actions, "actions", "searches, Blip, AI tools…")}${tile(t.api, "data loads", "what pages fetch")}${tile(s.bots?.n, "bot requests", `${s.bots?.who ?? 0} bots, kept apart`)}</div>
    <h2>People a day</h2>${daily(s.daily)}
    <div class="grid2"><div><h2>Actions</h2><table><thead><tr><th>Action</th><th class="n">Times</th><th class="n">People</th><th class="n">Failed</th></tr></thead><tbody>${s.actions.map((a) => `<tr><td>${esc(a.name)}</td><td class="n">${a.n}</td><td class="n">${a.people}</td><td class="n ${a.failed ? "bad" : ""}">${a.failed || ""}</td></tr>`).join("") || '<tr><td colspan="4" class="hint">None yet.</td></tr>'}</tbody></table></div>
      <div><h2>Pages</h2><table><thead><tr><th>Page</th><th class="n">Views</th><th class="n">People</th></tr></thead><tbody>${s.pages.map((p) => `<tr><td><a href="${esc(p.name)}">${esc(p.name)}</a></td><td class="n">${p.n}</td><td class="n">${p.people}</td></tr>`).join("") || '<tr><td colspan="3" class="hint">None yet.</td></tr>'}</tbody></table></div></div>
    <div class="grid2"><div><h2>What people search for</h2><table><thead><tr><th>Where</th><th>Words</th><th class="n">Times</th></tr></thead><tbody>${s.searches.map((x) => `<tr><td>${esc(x.name)}</td><td>${esc(x.detail)}</td><td class="n">${x.n}</td></tr>`).join("") || '<tr><td colspan="3" class="hint">None yet.</td></tr>'}</tbody></table></div>
      <div><h2>People</h2><p class="hint">Click one for their latest steps.</p><div class="scrollx"><table><thead><tr><th>Who</th><th class="n">Pages</th><th class="n">Actions</th><th>Last seen</th></tr></thead><tbody>${s.people.map((p) => `<tr data-who="${esc(p.who)}"><td>${nameOf(p.who, p.user_id)}</td><td class="n">${p.pages}</td><td class="n">${p.actions}</td><td>${when(p.last)}</td></tr>`).join("")}</tbody></table></div></div></div>
    <div id="actLog"><h2>Latest, everyone</h2>${eventsTable(recent.slice(0, 120))}</div>`;
  $("actStep").textContent = "";
}
async function loadJobsHealth() {
  $("jobsStep").textContent = "Loading…";
  const d = await get("/api/admin/jobs-health"), j = d.jobs, q = j.queues, c = j.counts, l = d.llm, bj = d.briefJobs, br = d.bridge;
  const tile = (v, lbl, sub = "") => `<div class="kpi card"><b>${esc(String(v))}</b><span>${lbl}${sub ? `<br>${sub}` : ""}</span></div>`;
  $("jobsOut").innerHTML = `<div class="kpis">${tile(c.open.toLocaleString(), "open jobs", `${c.openDup.toLocaleString()} duplicates`)}${tile(c.closed.toLocaleString(), "closed (≤ 1 yr)", `${j.db.sizeMb} MB DB, ${j.db.freelistMb} MB free`)}
    ${tile(q.needEmbedding, "need embeddings", `${j.orphaned.embClosedOrDup} orphaned`)}${tile(q.backfillPending, "need full text", br ? (br.crawlBusy ? `browser busy (+${br.crawlQueued})` : "browser idle") : "bridge off")}
    ${tile(q.freshForChecksPending, "checks queued (24h)")}${tile(`${l.waiting} / ${l.idleWaiting}`, "AI queue", `${l.busy ? "busy" : "idle"} · ${bj.active} active briefs`)}</div>
    <h2>Scheduled tasks</h2><div class="scrollx"><table><thead><tr><th>Task</th><th>Cron</th><th>Status</th><th class="n">Last run</th><th class="n">Duration</th><th>Error</th><th></th></tr></thead><tbody>
    ${d.schedule.map((t) => `<tr><td><b>${esc(t.name)}</b><br><span class="hint">${esc(t.note)}</span></td><td><code>${esc(t.cron)}</code></td>
      <td>${t.running ? `<span class="chip">running ${t.runningSeconds ?? 0}s / ${t.maxSeconds}s</span>` : "idle"}</td>
      <td class="n">${when(t.last)}</td><td class="n">${t.seconds != null ? `${t.seconds}s` : "—"}</td>
      <td class="${t.error ? "bad" : ""}">${esc(t.error ?? "")}</td>
      <td><button type="button" data-run="${esc(t.name)}" ${t.running ? "disabled" : ""}>Run</button></td></tr>`).join("")}</tbody></table></div>
    ${j.restingLanes.length ? `<h2>Resting rate-limited lanes</h2><p class="hint">${j.restingLanes.map((r) => `${esc(r.lane)} until ${when(r.until)}`).join(" · ")}</p>` : ""}
    ${j.boards.failingCount ? `<h2>Boards with errors (${j.boards.failingCount})</h2><div class="scrollx"><table><thead><tr><th>ATS</th><th>Board</th><th class="n">Open</th><th class="n">Last OK</th><th>Error</th></tr></thead><tbody>
      ${j.boards.failing.map((b) => `<tr><td>${esc(b.ats)}</td><td>${esc(b.name || b.slug)}</td><td class="n">${b.open ?? 0}</td><td class="n">${when(b.last_ok)}</td><td class="bad">${esc(b.last_err)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="hint">All ${j.boards.total} boards clean.</p>`}
    ${j.boards.staleBoards.length ? `<h2>Open jobs unseen &gt; 7 days</h2><div class="scrollx"><table><thead><tr><th>Source</th><th>Board</th><th class="n">Count</th><th class="n">Oldest seen</th></tr></thead><tbody>
      ${j.boards.staleBoards.map((s) => `<tr><td>${esc(s.source)}</td><td>${esc(s.board)}</td><td class="n">${s.open}</td><td class="n">${when(s.oldestSeen)}</td></tr>`).join("")}</tbody></table></div>` : ""}`;
  $("jobsStep").textContent = "";
}
$("jobsRefresh").onclick = () => { loadJobsHealth().catch((e) => ($("jobsStep").textContent = e.message)); loadSources().catch(() => {}); };
$("jobsOut").addEventListener("click", async (e) => {
  const name = e.target.dataset?.run; if (!name) return;
  e.target.disabled = true;
  try { await get(`/api/jobs/schedule?run=${encodeURIComponent(name)}`, { method: "POST" }); await loadJobsHealth(); } catch (err) { $("jobsStep").textContent = err.message; e.target.disabled = false; }
});
$("days").onchange = () => loadActivity().catch((e) => ($("actStep").textContent = e.message));
/** Every employer board: the ones with nothing open, or with jobs no read has seen for 2 days (the liveness check takes those), and who isn't read at all. */
const NOT_READ = [["KPMG", "its careers site is a script-only app with no feed found"], ["Microsoft", "read in part: its job site throttles after a few requests"]];
async function loadSources() {
  const l = await get("/api/admin/sources"), empty = l.filter((c) => !c.open), stale = l.filter((c) => c.stale > 0);
  const table = (rows) => `<div class="scrollx"><table><thead><tr><th>Board</th><th>System</th><th class="n">Open</th><th class="n">Unseen 2 days</th><th class="n">Last read</th><th>Last note</th></tr></thead><tbody>${rows.map((c) => `<tr><td>${esc(c.name)}</td><td>${esc(c.ats)}</td><td class="n">${c.open ?? 0}</td><td class="n">${c.stale || ""}</td><td class="n">${when(c.last_ok)}</td><td class="${c.last_err ? "bad" : ""}">${esc(c.last_err ?? "")}</td></tr>`).join("")}</tbody></table></div>`;
  $("sourcesOut").innerHTML = `<h2>Job sources (${l.length} boards)</h2>
    ${stale.length ? `<h3>Jobs not seen for 2 days (${stale.length} boards)</h3><p class="hint">Checked at their own page each hour (Adzuna and the job boards); the big employers' come back with their next full read.</p>${table(stale)}` : ""}
    ${empty.length ? `<h3>Boards with nothing open (${empty.length})</h3>${table(empty)}` : ""}
    <h3>Not read</h3><ul>${NOT_READ.map(([n, why]) => `<li><b>${esc(n)}</b>: ${esc(why)}</li>`).join("")}</ul>`;
}
// The big employers in and around NYC (coverage.ts): which the site reads, which have a known board the daily sweep or
// discovery will check, and which aren't found yet (to add by hand: their board, or a new kind of board to read)
async function loadCoverage() {
  const l = await get("/api/admin/coverage"), by = (s) => l.filter((r) => r.status === s), STATUS = { read: "read", listed: "board known, to be checked", none: "not found" };
  const why = (r) => [r.employees && `${r.employees.toLocaleString()} staff (Wikidata)`, r.ads && `${r.ads} job ads here in a year`, r.laidOff && `laid off ${r.laidOff} at one site here`].filter(Boolean).join(" · ");
  const table = (rows) => `<div class="scrollx"><table><thead><tr><th>Employer</th><th>Why it's here</th><th class="n">Open jobs</th><th>Status</th><th>Read as / known board</th></tr></thead><tbody>${rows.map((r) => `<tr><td>${r.website ? `<a href="${esc(r.website)}" target="_blank" rel="noopener">${esc(r.name)}</a>` : esc(r.name)}</td><td class="hint">${esc(why(r))}</td><td class="n">${r.open || ""}</td><td class="${r.status === "none" ? "bad" : ""}">${STATUS[r.status]}</td><td>${esc((r.status === "read" ? r.via : r.boards).join(", "))}</td></tr>`).join("")}</tbody></table></div>`;
  $("coverageOut").innerHTML = `<h2>Big employers in and around NYC (${l.length})</h2>
    <p class="hint">Based in the city with 1,000+ staff (Wikidata), 25+ job ads here in a year, or a layoff notice for 100+ at one site here. ${by("read").length} read, ${by("listed").length} with a known board the daily sweep or discovery will check, ${by("none").length} not found.</p>
    <h3>Not found (${by("none").length})</h3>${table(by("none"))}
    <details><summary>Board known, to be checked (${by("listed").length})</summary>${table(by("listed"))}</details>
    <details><summary>Read (${by("read").length})</summary>${table(by("read"))}</details>`;
}
for (const b of document.querySelectorAll(".tabs [data-tab]")) b.onclick = () => {
  for (const x of document.querySelectorAll(".tabs [data-tab]")) { x.setAttribute("aria-selected", String(x === b)); $(`t-${x.dataset.tab}`).hidden = x !== b; }
  if (b.dataset.tab === "activity" && !loadActivity.done) { loadActivity.done = true; loadActivity().catch((e) => ($("actStep").textContent = e.message)); }
  if (b.dataset.tab === "jobs" && !loadJobsHealth.done) { loadJobsHealth.done = true; loadJobsHealth().catch((e) => ($("jobsStep").textContent = e.message)); loadSources().catch((e) => ($("sourcesOut").textContent = e.message)); loadCoverage().catch((e) => ($("coverageOut").textContent = e.message)); }
};
loadUsers().catch((e) => ($("t-users").innerHTML = `<p>${esc(e.message)}</p>`));
</script>
</body>
</html>
