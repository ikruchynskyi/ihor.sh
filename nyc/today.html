<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New York today</title>
  <meta name="description" content="Today in New York on one screen: what's on, the weather, alerts, the subway, top news and critical incidents, rewritten every hour. Made to hang on a wall or sit in a Home Assistant dashboard." />
  <meta name="ihor-bare" content="a wall display (Home Assistant and the like): no site bar or Blip" />
  <meta name="ihor-listed" content="in search and the sitemap all the same" />
  <style>
    :root { --bg: #f6f4ef; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #fff; --accent: #c2410c; --warn: #b4232c; --ok: #1e6b35; --hi: #fff3e8; }
    :root[data-theme="dark"] { --bg: #0e0f11; --fg: #ecebe6; --muted: #9a978f; --line: #26272b; --card: #17181b; --accent: #ff8a3d; --warn: #ff6b6b; --ok: #69db7c; --hi: #2a1d13; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e0f11; --fg: #ecebe6; --muted: #9a978f; --line: #26272b; --card: #17181b; --accent: #ff8a3d; --warn: #ff6b6b; --ok: #69db7c; --hi: #2a1d13; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--fg); font: clamp(15px, 1.05vw + 4px, 24px)/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page { min-height: 100%; display: flex; flex-direction: column; gap: 1.1em; padding: clamp(14px, 2vw, 40px); max-width: 2200px; margin: 0 auto; }
    .kiosk body { cursor: none; } .kiosk .back { display: none; }
    header { display: flex; align-items: flex-end; gap: 1.2em; flex-wrap: wrap; }
    .title { flex: 1 1 auto; min-width: 0; } .title h1 { margin: 0; font-size: 1.05em; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    .title .date { font-size: 1.6em; font-weight: 650; line-height: 1.1; }
    .back { font-size: .7em; color: var(--muted); text-decoration: none; } .back:hover { color: var(--fg); }
    .clock { font-size: 3.4em; font-weight: 300; line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .wx { text-align: right; } .wx b { font-size: 2.6em; font-weight: 300; line-height: .9; display: block; } .wx span { color: var(--muted); font-size: .85em; }
    .headline { font-size: 1.45em; font-weight: 550; line-height: 1.3; margin: 0; padding: .7em .9em; background: var(--hi); border-left: 5px solid var(--accent); border-radius: 8px; }
    .grid { flex: 1; display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr); grid-template-areas: "ev nw ot"; gap: 1.1em; align-items: start; }
    #left { grid-area: ev; } #mid { grid-area: nw; } #right { grid-area: ot; }
    @media (max-width: 1199px) { .grid { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: "ev ot" "nw ot"; } }
    @media (max-width: 820px) { .grid { grid-template-columns: 1fr; grid-template-areas: "ev" "nw" "ot"; } .clock { font-size: 2.6em; } }
    .col { display: flex; flex-direction: column; gap: 1.1em; min-width: 0; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .8em 1em .6em; }
    .card h2 { margin: 0 0 .35em; font-size: .78em; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .card.main h2 { color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; }
    li button { all: unset; display: block; width: 100%; padding: .42em 0; border-top: 1px solid var(--line); cursor: pointer; }
    li:first-child button { border-top: 0; }
    li button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
    li button:active { opacity: .6; }
    .main li button { font-size: 1.12em; padding: .55em 0; }
    .alerts li button, .incidents li button { color: var(--warn); }
    .more { color: var(--muted); font-size: .8em; margin-left: .3em; }
    footer { color: var(--muted); font-size: .72em; display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
    .stale { color: var(--warn); }
    dialog { border: 0; border-radius: 14px; padding: 0; max-width: min(860px, 94vw); width: 100%; background: var(--card); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.4); }
    dialog::backdrop { background: rgba(0,0,0,.55); }
    .dlg { padding: 1.2em 1.4em; } .dlg h3 { margin: 0 0 .6em; font-size: 1.25em; line-height: 1.3; }
    .fact { display: flex; gap: 1em; align-items: flex-start; padding: .6em 0; border-top: 1px solid var(--line); } .fact p { margin: 0; flex: 1; }
    .qr { flex: none; background: #fff; padding: 6px; border-radius: 6px; line-height: 0; } .qr img, .qr canvas { width: 120px; height: 120px; }
    .dlg .close { all: unset; float: right; cursor: pointer; font-size: 1.4em; line-height: 1; padding: .1em .3em; color: var(--muted); }
    .hint { color: var(--muted); font-size: .8em; }
    .page-updated { display: none; } /* the site's "Last updated" line: the footer says when the data was */
    .ev { display: grid; grid-template-columns: 5.2em 1fr; gap: 0 .7em; align-items: baseline; }
    .ev.big > span:last-child { font-weight: 650; } .ev:not(.big) .t { color: var(--muted); }
    .ev .t { font-weight: 650; font-variant-numeric: tabular-nums; color: var(--accent); white-space: nowrap; }
    .ev .w { color: var(--muted); font-size: .82em; display: block; }
    .tag { display: inline-block; font-size: .72em; padding: 0 .45em; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); margin-left: .35em; vertical-align: .1em; }
    .tag.free { color: var(--ok); border-color: var(--ok); }
    .nw .w { color: var(--muted); font-size: .8em; display: block; }
    .gear { all: unset; cursor: pointer; color: var(--muted); font-size: 1.05em; padding: 0 .2em; } .gear:hover { color: var(--fg); }
    .opts fieldset { border: 1px solid var(--line); border-radius: 8px; margin: 0 0 .8em; padding: .4em .8em .6em; }
    .opts legend { font-weight: 650; padding: 0 .3em; } .opts label { display: inline-block; margin: .25em 1em .25em 0; white-space: nowrap; cursor: pointer; }
    .opts input[type=checkbox] { width: 1.1em; height: 1.1em; vertical-align: -.15em; }
    .opts .url { font: .8em ui-monospace, monospace; word-break: break-all; background: var(--bg); padding: .4em .6em; border-radius: 6px; user-select: all; }
    .btn { all: unset; cursor: pointer; padding: .35em .9em; border-radius: 8px; background: var(--accent); color: #fff; font-weight: 650; margin-right: .5em; } .btn.ghost { background: none; color: var(--fg); border: 1px solid var(--line); }
  </style>
</head>
<body>
<main class="page">
  <header>
    <div class="title"><a class="back" href="/nyc/">← NYC live map</a><h1>New York · today</h1><div class="date" id="date"></div></div>
    <div class="clock" id="clock" aria-label="Time in New York"></div>
    <div class="wx" id="wx"></div>
  </header>
  <p class="headline" id="headline" hidden></p>
  <div class="grid"><div class="col" id="left"></div><div class="col" id="mid"></div><div class="col" id="right"></div></div>
  <footer><span id="updated">Loading…</span><span>Sources: NYC alerts and open data, the National Weather Service, the MTA, local news and event listings · written by AI · tap a line for details · <button class="gear" id="gear" title="Choose what this screen shows" aria-label="Settings">⚙ Settings</button></span></footer>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
// ?kiosk=1 for a wall (no cursor, no links away, dark unless ?theme=light); ?theme=light|dark
const q = new URLSearchParams(location.search), kiosk = q.has("kiosk");
if (kiosk) document.documentElement.classList.add("kiosk");
const theme = q.get("theme") ?? (kiosk ? "dark" : ""); if (theme) document.documentElement.dataset.theme = theme;
</script>
<script type="module">
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const NY = { timeZone: "America/New_York" }, ICON = { headline: "✦", happening: "🎟", weather: "☁", alerts: "🚨", transit: "🚇", news: "📰", incidents: "⚠" };
const SECTION = { headline: "Headline", happening: "What's on today", weather: "Weather", alerts: "Alerts", transit: "Getting around", news: "Top news", incidents: "Critical incidents" };
const CATS = { more: "➕ More events, after the big ones", music: "🎵 Music", theater: "🎭 Theater", comedy: "😂 Comedy", sports: "🏟 Sports", family: "👪 Family", outdoors: "🌳 Outdoors", arts: "🎨 Arts", food: "🍽 Food", talks: "🎤 Talks", community: "🎉 Festivals & community", popups: "🛍 Pop-ups", other: "✨ Other" };
const TOPICS = { politics: "Politics", business: "Business", culture: "Culture", health: "Health", housing: "Housing", transit: "Transit", weather: "Weather", crime: "Crime", fire: "Fire", crash: "Crashes", sports: "Sports", other: "Other" };
// What this screen hides: ?hide=sports,n-crime,incidents (sections and event types by key, news topics as n-<topic>) or, set here, this browser's own choice
const KEY = "today-hide", fromUrl = new URLSearchParams(location.search).get("hide");
const loadHide = () => { if (fromUrl != null) return new Set(fromUrl.split(",").filter(Boolean)); try { return new Set(JSON.parse(localStorage.getItem(KEY) ?? "[]")); } catch { return new Set(); } };
let hide = loadHide(), data = null, failedSince = 0;
const kiosk = document.documentElement.classList.contains("kiosk");
function tick() {
  const d = new Date();
  $("clock").textContent = d.toLocaleTimeString("en-US", { ...NY, hour: "numeric", minute: "2-digit" });
  $("date").textContent = d.toLocaleDateString("en-US", { ...NY, weekday: "long", month: "long", day: "numeric" });
}
const hhmm = (t) => new Date(t * 1000).toLocaleTimeString("en-US", { ...NY, hour: "numeric", minute: "2-digit" });
const ago = (t) => { const m = Math.round((Date.now() / 1000 - t) / 60); return m < 60 ? `${Math.max(1, m)} min ago` : `${Math.round(m / 60)} h ago`; };
const nyNow = () => new Date().toLocaleString("sv-SE", NY).replace(" ", "T").slice(0, 16); // "2026-11-16T13:05", the events' clock
function render() {
  const d = data; if (!d) return;
  const w = d.weather;
  $("wx").innerHTML = w?.tempF != null ? `<b>${w.tempF}°F</b><span>${esc(w.sky ?? "")}${w.windKmh != null ? ` · wind ${w.windKmh} km/h` : ""}</span>` : "";
  $("headline").hidden = !d.headline || hide.has("headline"); $("headline").textContent = d.headline ?? "";
  const card = (k, items, main = false) => items.length && !hide.has(k) ? `<section class="card ${k}${main ? " main" : ""}"><h2>${ICON[k]} ${esc(SECTION[k])}</h2><ul>${items.join("")}</ul></section>` : "";
  const bullets = (k) => d.bullets.map((b, i) => ({ ...b, i })).filter((b) => b.section === k).map((b) => `<li><button data-b="${b.i}">${esc(b.text)}</button></li>`);
  // events: still to come (or on now), of the types this screen wants
  const soon = nyNow(), events = (d.events ?? []).map((e, i) => ({ ...e, i })).filter((e) => !hide.has(e.category) && (e.big || !hide.has("more")) && (e.allDay || e.start.slice(0, 16) >= soon || Date.parse(e.start) > Date.parse(soon) - 3 * 3600_000));
  const evRows = events.map((e) => `<li><button data-e="${e.i}" class="ev${e.big ? " big" : ""}"><span class="t">${esc(e.time)}</span><span>${esc(e.title)}${e.free ? '<span class="tag free">free</span>' : e.priceMin ? `<span class="tag">from $${Math.round(e.priceMin)}</span>` : ""}<span class="w">${esc([e.venue, e.borough].filter(Boolean).join(", "))} · ${esc(CATS[e.category] ?? e.category)}</span></span></button></li>`);
  const newsRows = (d.news ?? []).map((n, i) => ({ ...n, i })).filter((n) => !hide.has(`n-${n.topic}`)).map((n) => `<li><button data-n="${n.i}" class="nw">${esc(n.title)}<span class="w">${esc(n.outlets.join(", "))} · ${ago(n.at)}</span></button></li>`);
  const evCard = hide.has("happening") ? "" : (card("happening", evRows, true) || `<section class="card main"><h2>${ICON.happening} ${SECTION.happening}</h2><p class="hint">Nothing big left today${hide.size ? " among the kinds of events this screen shows" : ""}.</p></section>`);
  $("left").innerHTML = evCard; $("mid").innerHTML = card("news", newsRows);
  $("right").innerHTML = ["weather", "alerts", "transit", "incidents"].map((k) => card(k, bullets(k))).join("");
  const age = d.at ? Date.now() / 1000 - d.at : Infinity;
  $("updated").innerHTML = `${d.at ? `Updated ${hhmm(d.at)}` : "Not written yet"}${age > 3 * 3600 ? ' <span class="stale">· older than 3 hours</span>' : ""}${failedSince ? ` <span class="stale">· offline since ${new Date(failedSince).toLocaleTimeString("en-US", { ...NY, hour: "numeric", minute: "2-digit" })}</span>` : ""}`;
  fit();
}
/** One screen, no scrolling (a TV, a wall, any big screen): smaller type down to a floor, then the lists' last lines go. Phones scroll. */
function fit() {
  if (!kiosk && innerWidth < 900) { document.body.style.fontSize = ""; return; }
  const over = () => document.documentElement.scrollHeight > innerHeight + 1, floor = Math.max(12, innerWidth / 115);
  let px = Math.min(30, Math.max(14, innerWidth / 70)); document.body.style.fontSize = `${px}px`;
  while (over() && px > floor) document.body.style.fontSize = `${(px -= 0.5)}px`;
  for (let guard = 0; over() && guard < 200; guard++) { // the longest list gives up a line, keeping two in each
    const lists = [...document.querySelectorAll(".grid ul")].filter((u) => u.children.length > 2).sort((a, b) => b.children.length - a.children.length);
    if (!lists.length) break; lists[0].lastElementChild.remove();
  }
}
addEventListener("resize", () => { clearTimeout(fit.t); fit.t = setTimeout(render, 200); });
async function load() {
  try { const r = await fetch("/nyc/today.json", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); data = await r.json(); failedSince = 0; }
  catch { failedSince ||= Date.now(); }
  render();
}
// a line's details, with a QR code to open its link on a phone
let qrLib = null, closeTimer = 0;
const loadQr = () => (qrLib ??= new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload = ok; s.onerror = no; document.head.append(s); }));
async function show(title, rows) { // rows: [{ text, url }]
  $("dlgBody").innerHTML = `<button class="close" aria-label="Close">✕</button><h3>${esc(title)}</h3>${rows.map((r, n) => `<div class="fact"><p>${r.html ?? esc(r.text)}${r.url && !kiosk ? `<br><a href="${esc(r.url)}" target="_blank" rel="noopener">Open ↗</a>` : ""}</p>${r.url ? `<div class="qr" id="qr${n}" title="Scan to open on your phone"></div>` : ""}</div>`).join("")}
    ${rows.some((r) => r.url) ? '<p class="hint">Scan the code to open it on your phone.</p>' : ""}`;
  $("dlg").showModal(); clearTimeout(closeTimer); if (kiosk) closeTimer = setTimeout(() => $("dlg").close(), 60_000);
  if (rows.some((r) => r.url)) { await loadQr().catch(() => null); rows.forEach((r, n) => { if (r.url && window.QRCode) new QRCode($(`qr${n}`), { text: r.url, width: 240, height: 240, correctLevel: QRCode.CorrectLevel.M }); }); }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button[data-b],button[data-e],button[data-n]"); if (!t) return;
  if (t.dataset.e) { const v = data.events[+t.dataset.e]; return show(v.title, [{ html: `${esc(v.time)}${v.venue ? ` · ${esc(v.venue)}` : ""}${v.borough ? `, ${esc(v.borough)}` : ""}<br>${esc(CATS[v.category] ?? v.category)}${v.free ? " · free" : v.priceMin ? ` · from $${Math.round(v.priceMin)}` : ""}`, url: v.url }]); }
  if (t.dataset.n) { const v = data.news[+t.dataset.n]; return show(v.title, [{ text: `${v.outlets.join(", ")} · ${hhmm(v.at)}`, url: v.url }]); }
  const b = data.bullets[+t.dataset.b]; show(b.text, b.facts.map((id) => data.facts.find((f) => f.id === id)).filter(Boolean));
});
$("dlg").addEventListener("click", (e) => { if (e.target === $("dlg") || e.target.closest(".close")) $("dlg").close(); });
// ⚙: what this screen shows, kept in this browser; and the address that carries it to another screen (a Home Assistant card)
function settings() {
  const box = (group, key, label) => `<label><input type="checkbox" data-k="${key}" ${hide.has(key) ? "" : "checked"}> ${esc(label)}</label>`;
  $("dlgBody").innerHTML = `<button class="close" aria-label="Close">✕</button><h3>What this screen shows</h3><div class="opts">
    <fieldset><legend>Sections</legend>${Object.entries(SECTION).map(([k, l]) => box("s", k, l)).join("")}</fieldset>
    <fieldset><legend>Events</legend>${Object.entries(CATS).map(([k, l]) => box("c", k, l)).join("")}</fieldset>
    <fieldset><legend>News</legend>${Object.entries(TOPICS).map(([k, l]) => box("t", `n-${k}`, l)).join("")}</fieldset>
    <p><button class="btn" id="optSave">Save</button><button class="btn ghost" id="optAll">Show everything</button></p>
    <p class="hint">Saved on this screen. To use the same choice on another screen or in Home Assistant, open this address there:</p><p class="url" id="optUrl"></p></div>`;
  const pick = () => new Set([...$("dlgBody").querySelectorAll("input[data-k]")].filter((i) => !i.checked).map((i) => i.dataset.k));
  const url = () => { const h = [...pick()], u = new URL(location.href); u.search = ""; if (kiosk) u.searchParams.set("kiosk", "1"); if (h.length) u.searchParams.set("hide", h.join(",")); $("optUrl").textContent = decodeURIComponent(u.href); };
  $("dlgBody").addEventListener("change", url); url();
  $("optAll").onclick = () => { $("dlgBody").querySelectorAll("input[data-k]").forEach((i) => (i.checked = true)); url(); };
  $("optSave").onclick = () => { hide = pick(); try { localStorage.setItem(KEY, JSON.stringify([...hide])); } catch {} if (fromUrl != null) { const u = new URL(location.href); u.searchParams.delete("hide"); history.replaceState(null, "", u); } $("dlg").close(); render(); };
  clearTimeout(closeTimer); $("dlg").showModal();
}
$("gear").onclick = settings;
tick(); setInterval(tick, 1000);
load(); setInterval(load, 5 * 60_000); // the weather, the brief and the lists, every 5 minutes: no reload needed
</script>
</body>
</html>
