<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>New York today</title>
  <meta name="description" content="New York on one screen for a TV or a wall: the time, the weather and the next two hours, alerts, getting around, the top news and this week's big concerts with a code to buy tickets. Updates itself." />
  <meta name="ihor-bare" content="a wall display (a TV, Home Assistant): no site bar or Blip" />
  <meta name="ihor-listed" content="in search and the sitemap all the same" />
  <style>
    :root { --bg: #f6f4ef; --fg: #1d1d1b; --muted: #6b6a66; --line: #dcd8cf; --card: #fff; --accent: #c2410c; --warn: #b4232c; --rain: #1c7ed6; }
    :root[data-theme="dark"] { --bg: #0e0f11; --fg: #f1f0ec; --muted: #a3a09a; --line: #2a2b30; --card: #17181b; --accent: #ff8a3d; --warn: #ff7676; --rain: #4dabf7; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #0e0f11; --fg: #f1f0ec; --muted: #a3a09a; --line: #2a2b30; --card: #17181b; --accent: #ff8a3d; --warn: #ff7676; --rain: #4dabf7; } }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--fg); font: 18px/1.35 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .page { min-height: 100%; display: flex; flex-direction: column; gap: 1em; padding: 1.4em 1.8em; max-width: 2200px; margin: 0 auto; }
    .idle body, .idle * { cursor: none !important; } .kiosk .back { display: none; }
    .back { font-size: .6em; color: var(--muted); text-decoration: none; }
    h1 { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); } /* the screen shows the time, not a title */
    .top { display: grid; grid-template-columns: auto minmax(0, 1fr) minmax(0, 1.1fr); gap: 2em; align-items: center; }
    .clock { font-size: 4.2em; font-weight: 300; line-height: .95; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .date { font-size: 1.15em; color: var(--muted); margin-top: .25em; }
    .now { display: flex; gap: .5em; align-items: center; } .now .ico { font-size: 3.2em; line-height: 1; } .now b { font-size: 3.4em; font-weight: 300; line-height: 1; } .now span { color: var(--muted); }
    .fc { margin: .5em 0 0; padding: 0; list-style: none; font-size: .95em; } .fc li { margin: .15em 0; } .fc b { display: inline-block; min-width: 6.5em; }
    .two h2, .card h2 { margin: 0 0 .4em; font-size: .78em; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 650; }
    .two p { margin: 0 0 .3em; font-size: 1.05em; }
    .spark { display: flex; align-items: flex-end; gap: 4px; height: 2.4em; border-bottom: 2px solid var(--line); } .spark i { flex: 1; background: var(--rain); border-radius: 3px 3px 0 0; height: var(--h); min-height: 0; }
    .ticks { display: flex; justify-content: space-between; margin-top: .25em; font-size: .9em; } .ticks span { color: var(--muted); } .ticks b { color: var(--fg); }
    .cards { flex: 1; columns: 2; column-gap: 1.2em; }
    @media (max-aspect-ratio: 1/1), (max-width: 760px) { .cards { columns: 1; } .top { grid-template-columns: 1fr; gap: 1em; } }
    .card { break-inside: avoid; display: inline-block; width: 100%; margin: 0 0 1.2em; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: .8em 1.1em .6em; }
    .card.concerts h2 { color: var(--accent); }
    ul.items { list-style: none; margin: 0; padding: 0; }
    .items li { border-top: 1px solid var(--line); } .items li:first-child { border-top: 0; }
    .item { all: unset; display: block; width: 100%; padding: .45em .3em; cursor: pointer; border-radius: 6px; }
    .item:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; background: color-mix(in srgb, var(--accent) 12%, transparent); }
    .item .when { color: var(--accent); font-weight: 650; font-variant-numeric: tabular-nums; } .item .sub { color: var(--muted); font-size: .82em; display: block; }
    .item .what { font-weight: 600; } .item.one { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .item.one .sub { display: inline; font-size: .85em; }
    .item.two { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .lines li { padding: .4em 0; } .alerts .lines li { color: var(--warn); }
    footer { color: var(--muted); font-size: .62em; display: flex; justify-content: space-between; gap: 1em; flex-wrap: wrap; }
    .stale { color: var(--warn); }
    dialog { border: 0; border-radius: 16px; padding: 0; max-width: min(760px, 94vw); width: 100%; background: var(--card); color: var(--fg); box-shadow: 0 20px 60px rgba(0,0,0,.45); }
    dialog::backdrop { background: rgba(0,0,0,.6); }
    .dlg { padding: 1.3em 1.5em; display: flex; gap: 1.4em; align-items: center; } .dlg h3 { margin: 0 0 .4em; font-size: 1.3em; line-height: 1.25; } .dlg p { margin: .3em 0; }
    .qr { flex: none; background: #fff; padding: 8px; border-radius: 8px; line-height: 0; } .qr img, .qr canvas { width: 220px; height: 220px; }
    .hint { color: var(--muted); font-size: .85em; }
    .page-updated { display: none; } /* the site's "Last updated" line: the footer says when */
  </style>
</head>
<body>
<main class="page">
  <h1>New York today</h1>
  <section class="top">
    <div><a class="back" href="/nyc/">← NYC live map</a><div class="clock" id="clock"></div><div class="date" id="date"></div></div>
    <div><div class="now" id="now"></div><ul class="fc" id="fc"></ul></div>
    <div class="two" id="two"></div>
  </section>
  <div class="cards" id="cards"></div>
  <footer><span id="updated">Loading…</span><span>Weather: National Weather Service, Open-Meteo · alerts, transit and news: NYC, the MTA and local newsrooms, summed up by AI · concerts: Ticketmaster</span></footer>
</main>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<script>
// ?kiosk=1 (what ihor.sh/tv opens): dark, no links away; ?theme=light|dark
const q = new URLSearchParams(location.search), kiosk = q.has("kiosk");
if (kiosk) document.documentElement.classList.add("kiosk");
const theme = q.get("theme") ?? (kiosk ? "dark" : ""); if (theme) document.documentElement.dataset.theme = theme;
</script>
<script type="module" src="/dialogs.js"></script>
<script type="module">
const $ = (id) => document.getElementById(id), esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const NY = { timeZone: "America/New_York" }, kiosk = document.documentElement.classList.contains("kiosk");
let data = null, failedSince = 0;
const time = (d) => d.toLocaleTimeString("en-US", { ...NY, hour: "numeric", minute: "2-digit" });
function tick() { const d = new Date(); $("clock").textContent = time(d); $("date").textContent = d.toLocaleDateString("en-US", { ...NY, weekday: "long", month: "long", day: "numeric" }); }
const nyHour = () => Number(new Date().toLocaleString("en-US", { ...NY, hour: "numeric", hour12: false }));
const icon = (sky = "", night = nyHour() >= 18 || nyHour() < 6) => { const s = sky.toLowerCase();
  return /thunder/.test(s) ? "⛈" : /snow|flurr|sleet/.test(s) ? "🌨" : /rain|shower|drizzle/.test(s) ? "🌧" : /fog|mist|haze/.test(s) ? "🌫" : /overcast|^cloudy|mostly cloudy/.test(s) ? "☁" : /partly|few clouds|mostly clear|mostly sunny/.test(s) ? (night ? "☁" : "⛅") : night ? "🌙" : "☀"; };
// "2026-11-18T19:30" (New York time, as listed) → "Wed 7:30 PM"; today's → "Tonight 7:30 PM"
const showTime = (s) => { const [d, t] = s.split("T"), [h, m] = t.split(":").map(Number), day = new Date(`${d}T12:00:00Z`).toLocaleDateString("en-US", { weekday: "short", timeZone: "UTC" });
  const today = new Date().toLocaleDateString("en-CA", NY); return `${d === today ? "Tonight" : day} ${((h + 11) % 12) + 1}${m ? `:${String(m).padStart(2, "0")}` : ""} ${h < 12 ? "AM" : "PM"}`; };
/** The next 2 hours: rain every 15 minutes as bars over a baseline, the temperature now, in an hour and in two. */
function twoHours(n) {
  if (!n?.length) return "";
  const wet = n.map((p) => p.rainMm >= 0.05), first = wet.indexOf(true), lastWet = wet.lastIndexOf(true), at = (i) => time(new Date(`${n[i].t}:00-05:00`));
  const say = first < 0 ? "Dry for the next 2 hours" : first === 0 ? (lastWet < n.length - 1 ? `Rain, stopping around ${at(lastWet + 1)}` : "Rain for the next 2 hours") : `Rain from about ${at(first)}`;
  const max = Math.max(0.6, ...n.map((p) => p.rainMm));
  return `<h2>Next 2 hours</h2><p>${icon(n[first < 0 ? 0 : first].sky)} ${say}</p>
    <div class="spark" role="img" aria-label="${esc(say)}">${n.map((p, i) => `<i style="--h:${p.rainMm >= 0.05 ? Math.max(8, Math.round((p.rainMm / max) * 100)) : 0}%" title="${at(i)}: ${p.rainMm} mm"></i>`).join("")}</div>
    <div class="ticks">${[0, 4, 8].filter((i) => n[i]).map((i) => `<span>${i ? `+${i / 4}h` : "now"} <b>${n[i].tempF}°</b></span>`).join("")}</div>`;
}
function render() {
  const d = data; if (!d) return;
  const w = d.weather;
  $("now").innerHTML = w?.tempF != null ? `<span class="ico">${icon(w.sky)}</span><div><b>${w.tempF}°</b><br><span>${esc(w.sky ?? "")}${w.windKmh != null ? ` · wind ${w.windKmh} km/h` : ""}</span></div>` : "";
  $("fc").innerHTML = (d.forecast ?? []).slice(0, 2).map((p) => `<li><b>${esc(p.name)}</b> ${icon(p.short, /night|tonight/i.test(p.name))} ${p.temp}° · ${esc(p.short)}${p.rain >= 20 ? ` · rain ${p.rain}%` : ""}</li>`).join("");
  $("two").innerHTML = twoHours(d.nowcast);
  const card = (cls, title, body) => body ? `<section class="card ${cls}"><h2>${title}</h2>${body}</section>` : "";
  const lines = (l) => (l?.length ? `<ul class="items lines">${l.slice(0, 3).map((x) => `<li>${esc(x.text)}</li>`).join("")}</ul>` : "");
  $("cards").innerHTML = [
    card("concerts", "🎵 Concerts this week", d.concerts?.length ? `<ul class="items">${d.concerts.map((c, i) => `<li><button class="item one" data-c="${i}"><span class="when">${esc(showTime(c.start))}</span>  <span class="what">${esc(c.title)}</span> <span class="sub">· ${esc(c.venue ?? "")}</span></button></li>`).join("")}</ul>` : ""),
    card("alerts", "🚨 Alerts", lines(d.alerts)),
    card("transit", "🚇 Getting around", lines(d.transit)),
    card("news", "📰 Top news", d.news?.length ? `<ul class="items">${d.news.slice(0, 3).map((n, i) => `<li><button class="item two" data-n="${i}">${esc(n.title)}</button></li>`).join("")}</ul>` : ""),
  ].join("");
  const age = d.at ? Date.now() / 1000 - d.at : Infinity;
  $("updated").innerHTML = `${d.at ? `Updated ${time(new Date(d.at * 1000))}` : ""}${age > 3 * 3600 ? ' <span class="stale">· older than 3 hours</span>' : ""}${failedSince ? ` <span class="stale">· offline since ${time(new Date(failedSince))}</span>` : ""}`;
  fit();
}
/** One screen, no scrolling (phones scroll): the type as big as fits. */
function fit() {
  if (innerWidth < 760 && innerWidth < innerHeight) { document.body.style.fontSize = ""; return; }
  let px = Math.min(34, Math.max(14, Math.min(innerWidth / 52, innerHeight / 30)));
  const over = () => document.documentElement.scrollHeight > innerHeight + 1;
  document.body.style.fontSize = `${px}px`;
  while (over() && px > 10) document.body.style.fontSize = `${(px -= 0.5)}px`;
}
addEventListener("resize", () => { clearTimeout(fit.t); fit.t = setTimeout(fit, 200); });
async function load() {
  try { const r = await fetch("/nyc/today.json", { cache: "no-store" }); if (!r.ok) throw new Error(r.status); data = await r.json(); failedSince = 0; }
  catch { failedSince ||= Date.now(); }
  const focused = document.activeElement?.dataset; render();
  if (focused?.c || focused?.n) document.querySelector(focused.c ? `[data-c="${focused.c}"]` : `[data-n="${focused.n}"]`)?.focus(); // a refresh keeps the remote's place
}
// a concert or a story: a code to open it on a phone (buy the tickets, read the story)
let qrLib = null, closeTimer = 0;
const loadQr = () => (qrLib ??= new Promise((ok, no) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"; s.onload = ok; s.onerror = no; document.head.append(s); }));
async function show(title, html, url, scan) {
  $("dlgBody").innerHTML = `${url ? '<div class="qr" id="qr"></div>' : ""}<div><h3>${esc(title)}</h3>${html}${url ? `<p class="hint">${esc(scan)}</p>${kiosk ? "" : `<p><a href="${esc(url)}" target="_blank" rel="noopener">Open ↗</a></p>`}` : ""}</div>`;
  $("dlg").showModal(); clearTimeout(closeTimer); closeTimer = setTimeout(() => $("dlg").open && $("dlg").close(), 90_000); // a wall goes back to the overview
  if (url) { await loadQr().catch(() => null); if (window.QRCode) new QRCode($("qr"), { text: url, width: 440, height: 440, correctLevel: QRCode.CorrectLevel.M }); }
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("button.item"); if (!t) return;
  if (t.dataset.c) { const c = data.concerts[+t.dataset.c]; return show(c.title, `<p><b>${esc(showTime(c.start))}</b></p><p>${esc([c.venue, c.borough].filter(Boolean).join(", "))}${c.priceMin ? ` · from $${Math.round(c.priceMin)}` : ""}</p>`, c.url, "Scan with your phone to buy tickets"); }
  const n = data.news[+t.dataset.n]; show(n.title, `<p class="hint">${esc(n.outlets.join(", "))}</p>`, n.url, "Scan with your phone to read it");
});
// a TV remote: the arrows move between the concerts and stories, OK opens one; the pointer hides when it's still
addEventListener("keydown", (e) => {
  if ($("dlg").open) return;
  const all = [...document.querySelectorAll("button.item")], at = all.indexOf(document.activeElement);
  if (["ArrowDown", "ArrowRight"].includes(e.key)) { e.preventDefault(); all[at < 0 ? 0 : (at + 1) % all.length]?.focus(); }
  if (["ArrowUp", "ArrowLeft"].includes(e.key)) { e.preventDefault(); all[at < 0 ? 0 : (at - 1 + all.length) % all.length]?.focus(); }
});
let idleT = 0; const wake = () => { document.documentElement.classList.remove("idle"); clearTimeout(idleT); idleT = setTimeout(() => document.documentElement.classList.add("idle"), 4000); };
addEventListener("mousemove", wake); wake();
tick(); setInterval(tick, 1000);
load(); setInterval(load, 5 * 60_000); // weather, the next 2 hours, alerts, news and concerts every 5 minutes: no reload needed
</script>
</body>
</html>
